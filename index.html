// ── Astronomical sun/moon calculations (no API required) ────────────────
// Returns { sunrise, sunset, dawn, dusk } as 'HH:MM' in the location's UTC offset
function computeSunTimes(lat, lng, utcOffsetMin) {
  if (utcOffsetMin == null) utcOffsetMin = -new Date().getTimezoneOffset();
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  // Days since J2000.0
  const jd = (new Date() - new Date('2000-01-01T12:00:00Z')) / 86400000;
  // Mean longitude and anomaly
  const L = ((280.460 + 0.9856474 * jd) % 360 + 360) % 360;
  const g = toRad(((357.528 + 0.9856003 * jd) % 360 + 360) % 360);
  // Ecliptic longitude
  const lam = toRad(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
  // Obliquity and declination
  const eps = toRad(23.439 - 4e-7 * jd);
  const sinDec = Math.sin(eps) * Math.sin(lam);
  const cosDec = Math.cos(Math.asin(sinDec));
  // Right ascension & equation of time (minutes)
  const RA = toDeg(Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)));
  const eot = 4 * (((L - RA) % 360 + 540) % 360 - 180);
  const solarNoon = 720 - 4 * lng - eot; // UTC minutes
  // Solve hour angle for given solar zenith
  const ha = z => {
    const c = (Math.sin(toRad(z)) - Math.sin(toRad(lat)) * sinDec) /
              (Math.cos(toRad(lat)) * cosDec);
    return Math.abs(c) <= 1 ? toDeg(Math.acos(c)) : null;
  };
  const haR = ha(-0.8333); // sunrise/set (accounting for refraction)
  const haC = ha(-6);      // civil twilight
  const fmt = min => {
    const m = ((min + utcOffsetMin) % 1440 + 1440) % 1440;
    const h = Math.floor(m / 60) % 24, mn = Math.round(m % 60);
    const hh = mn >= 60 ? (h + 1) % 24 : h, mm = mn >= 60 ? 0 : mn;
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  };
  return {
    sunrise: haR ? fmt(solarNoon - haR * 4) : '06:00',
    sunset:  haR ? fmt(solarNoon + haR * 4) : '18:30',
    dawn:    haC ? fmt(solarNoon - haC * 4) : '05:30',
    dusk:    haC ? fmt(solarNoon + haC * 4) : '19:00',
  };
}

// Returns { phase (name string), illumination (0–1) }
function computeMoonPhase(date) {
  if (!date) date = new Date();
  const knownNM = new Date('2000-01-06T18:14:00Z'); // known new moon
  const synodic  = 29.53058770576;                  // days per lunation
  const elapsed  = (date - knownNM) / 86400000;
  const phase    = ((elapsed % synodic) + synodic) % synodic; // 0 = new moon
  const illum    = +(0.5 * (1 - Math.cos(2 * Math.PI * phase / synodic))).toFixed(2);
  const names    = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
                    'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const idx      = Math.floor(((phase / synodic * 8) + 0.5) % 8);
  return { phase: names[idx], illumination: illum };
}

// ── generateLocationData: produce varied-but-consistent mock data
//    seeded deterministically from lat/lng so each location looks different.
function generateLocationData(loc) {
  const lat = loc.lat != null ? loc.lat : -35.18;
  const lng = loc.lng != null ? loc.lng : 174.33;
  // real current time
  const _now = new Date();
  const _nowH = _now.getHours();
  const _nowM = _now.getMinutes();
  // deterministic pseudo-random: h(n) → 0..1
  const h = n => { let x = Math.sin(lat * 127.1 + lng * 311.7 + n * 74.3) * 43758.5453; return x - Math.floor(x); };
  const pad = n => String(Math.floor(n)).padStart(2, '0');
  const fmt = (hh, mm) => `${pad(hh % 24)}:${pad(((mm % 60) + 60) % 60)}`;

  const dirs16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const dirs8  = ['N','NE','E','SE','S','SW','W','NW'];
  const phases = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const trends = ['rising','falling','steady'];
  const conds  = ['clear','partly','cloud','partly','clear','rain'];
  const peaks  = ['05:45 — 09:00','06:00 — 09:30','06:30 — 08:00','17:30 — 20:00','18:00 — 20:30'];

  const score      = Math.round(35 + h(1) * 55);
  const windSpeed  = Math.round(5 + h(2) * 22);
  const windDir    = Math.round(h(4) * 360);
  const windDirLabel = dirs16[Math.round(h(4) * 15)];
  const waveHeight = +((0.4 + h(5) * 2.8).toFixed(1));
  const swellPeriod = Math.round(5 + h(6) * 10);
  const swellDir   = dirs8[Math.floor(h(7) * 8)];
  const waterTemp  = +((12 + h(8) * 10).toFixed(1));
  const airTemp    = Math.round(11 + h(9) * 12);
  const barometric = Math.round(1000 + h(10) * 30);
  const baro_trend = trends[Math.floor(h(11) * 3)];
  const baroDelta  = +((h(12) * 6 - 3).toFixed(1));
  const uvRaw      = Math.round(1 + h(13) * 10);
  const uvLabel    = uvRaw <= 2 ? 'Low' : uvRaw <= 5 ? 'Moderate' : uvRaw <= 7 ? 'High' : uvRaw <= 9 ? 'Very High' : 'Extreme';
  const moonIllum  = +(h(16).toFixed(2));
  const moonPhase  = phases[Math.floor(h(16) * 8) % 8];

  // Tide times — semi-diurnal (4 tides spread across 24h)
  const baseH = Math.floor(h(20) * 12);
  const baseM = Math.floor(h(21) * 60);
  const addMin = (bh, bm, mins) => { const t = bh * 60 + bm + Math.round(mins); return { hh: Math.floor(t / 60) % 24, mm: t % 60 }; };
  const t_h1 = { hh: baseH, mm: baseM };
  const t_l1 = addMin(baseH, baseM, 370 + h(22) * 50);
  const t_h2 = addMin(baseH, baseM, 745 + h(23) * 30);
  const t_l2 = addMin(baseH, baseM, 1120 + h(24) * 50);
  const th1 = +(1.5 + h(25) * 0.7).toFixed(2);
  const tl1 = +(0.08 + h(26) * 0.25).toFixed(2);
  const th2 = +(1.4 + h(27) * 0.8).toFixed(2);
  const tl2 = +(0.1 + h(28) * 0.25).toFixed(2);
  // Tide curve — computed here so tideEvents are derived from its actual peaks/troughs
  const tph = h(29) * Math.PI * 2;
  const tide = Array.from({ length: 48 }, (_, i) => {
    const t = i / 48 * 24;
    return { t, hour: t, height: +(1.0 + 0.95 * Math.sin((t / 12.42) * Math.PI * 2 + tph)).toFixed(2) };
  });
  // Scan for local maxima/minima — markers will sit exactly on the curve
  const _tideMean = tide.reduce((a, b) => a + b.height, 0) / tide.length;
  const tideEvents = [];
  for (let _ti = 1; _ti < tide.length - 1; _ti++) {
    const _p = tide[_ti-1].height, _c = tide[_ti].height, _n = tide[_ti+1].height;
    const _hh = Math.floor(tide[_ti].t), _mm = Math.round((tide[_ti].t - _hh) * 60);
    if (_c > _p && _n <= _c && _c > _tideMean)
      tideEvents.push({ time: fmt(_hh, _mm), label: 'High', height: tide[_ti].height });
    else if (_c < _p && _n >= _c && _c < _tideMean)
      tideEvents.push({ time: fmt(_hh, _mm), label: 'Low',  height: tide[_ti].height });
  }
  tideEvents.sort((a, b) => a.time.localeCompare(b.time));
  // State and height from curve at current hour
  const _nowTi   = Math.min(47, Math.round(_nowH * 2));
  const tideHeight = tide[_nowTi].height;
  const tideState  = _nowTi < 47 && tide[_nowTi + 1].height > tide[_nowTi].height ? 'Rising' : 'Falling';
  const _nowHM = fmt(Math.floor(_nowH), Math.round((_nowH % 1) * 60));
  const _wantLabel = tideState === 'Rising' ? 'High' : 'Low';
  const nextTideEvt = tideEvents.find(e => e.label === _wantLabel && e.time >= _nowHM)
                   || tideEvents.find(e => e.label === _wantLabel);
  const nextTide   = nextTideEvt ? `${nextTideEvt.label} ${nextTideEvt.time}` : 'High 14:32';

  // Sun times
  const srH = 5 + Math.floor(h(30) * 2);
  const srM = Math.floor(h(31) * 60);
  const ssH = 17 + Math.floor(h(32) * 3);
  const ssM = Math.floor(h(33) * 60);

  const now = {
    score, windSpeed,
    windGust: Math.round(windSpeed + 3 + h(3) * 10),
    windDir, windDirLabel, waveHeight, swellPeriod, swellDir,
    waterTemp, airTemp, barometric,
    barometricTrend: baro_trend, barometricDelta: baroDelta,
    uv: uvRaw, uvLabel, tideState, tideHeight, nextTide,
    moonPhase, moonIllum,
    dawn:    fmt(srH - 1 < 0 ? 0 : srH - 1, srM < 30 ? srM + 30 : srM - 30),
    sunrise: fmt(srH, srM),
    sunset:  fmt(ssH, ssM),
    dusk:    fmt(ssH, ssM < 30 ? ssM + 35 : ssM - 25),
  };

  // Hourly
  const hourly = Array.from({ length: 24 }, (_, i) => {
    const hr = (_nowH + i) % 24;
    const hs = Math.round(score * 0.55 + 22 * Math.sin((hr / 24) * Math.PI * 2 - 0.5) + (hr >= 5 && hr <= 7 || hr >= 17 && hr <= 19 ? 10 : 0) + h(40 + i) * 14);
    return {
      hour: hr,
      label: i === 0 ? 'Now' : `${String(hr).padStart(2,'0')}:00`,
      score: Math.max(15, Math.min(98, hs)),
      temp:  +((airTemp - 2 + h(50 + i) * 5).toFixed(1)),
      wind:  Math.round(windSpeed * 0.6 + h(60 + i) * windSpeed * 0.6),
      cond:  conds[Math.floor(h(70 + i) * conds.length)],
    };
  });

  // Daily — real dates
  const _dayNames = Array.from({length:7}, (_,i) => { const d=new Date(_now); d.setDate(d.getDate()+i); return i===0?'Today':d.toLocaleDateString('en-US',{weekday:'short'}); });
  const _dayDates = Array.from({length:7}, (_,i) => { const d=new Date(_now); d.setDate(d.getDate()+i); return d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'}).replace(',',''); });
  const daily = _dayNames.map((day, i) => {
    const ds = i === 0 ? score : Math.round(Math.max(15, Math.min(98, score + h(80 + i) * 40 - 20)));
    return {
      day, date: _dayDates[i],
      hi: Math.round(airTemp + h(90 + i) * 4 - 1),
      lo: Math.round(airTemp - 4 + h(95 + i) * 3),
      score: ds,
      peakWindow: ds > 60 ? peaks[Math.floor(h(85 + i) * peaks.length)] : '—',
      cond: conds[Math.floor(h(88 + i) * conds.length)],
    };
  });

  // Species with varied scores
  const species = window.TL_DATA.species.map((sp, i) => ({
    ...sp,
    score: Math.round(Math.max(20, Math.min(98, sp.score + h(100 + i) * 30 - 15))),
  }));

  return {
    location: loc,
    now, hourly, daily, tide, tideEvents, species,
    recentLocations: window.TL_DATA.recentLocations,
  };
}

// ── fetchWeatherData: real data from Open-Meteo (ECMWF + GFS + Marine) ─
// Averages 3 reputable forecast models for wind/temp/pressure.
// Falls back to generateLocationData() if the primary source fails.
async function fetchWeatherData(loc) {
  const { lat, lng } = loc;

  // ── Utilities ──
  const dir16 = d => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((d%360)+360)%360/22.5)%16];
  const dir8  = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d%360)+360)%360/45)%8];
  const pad2  = n => String(Math.floor(((n%24)+24)%24)).padStart(2,'0');
  const uvLbl = u => u<=2?'Low':u<=5?'Moderate':u<=7?'High':u<=9?'Very High':'Extreme';
  const wmo2cond = c => c===0||c===1?'clear':c<=3?'partly':c<=48?'cloud':'rain';

  // Fishing bite score from real conditions
  const score = (ws, wh, hr, wt, mi, rising) => {
    let s = 50;
    if (ws < 5)         s -= 5;  else if (ws <= 15) s += 15;
    else if (ws <= 20)  s += 5;  else s -= Math.min(30, (ws - 20) * 2);
    if (wh < 0.3)       s -= 5;  else if (wh <= 1.0)  s += 10;
    else if (wh <= 2.0) s -= (wh - 1.0) * 15; else s -= 30;
    if ((hr>=5&&hr<=7)||(hr>=17&&hr<=20)) s += 15; else if (hr<5||hr>21) s -= 10;
    if (wt >= 18) s += 8; else if (wt < 14) s -= 10;
    if (mi > 0.8 || mi < 0.2) s += 5;
    if (rising) s += 5;
    return Math.max(10, Math.min(98, Math.round(s)));
  };

  // ── Fetch 4 sources in parallel ──
  const GEO  = `latitude=${lat}&longitude=${lng}&timezone=auto&wind_speed_unit=kn&forecast_days=7`;
  const FURL = `https://api.open-meteo.com/v1/forecast?${GEO}`;
  const MURL = `https://marine-api.open-meteo.com/v1/marine?${GEO}`;

  const [r1, r2, r3, rm] = await Promise.allSettled([
    // Primary: best_match + full hourly/daily
    fetch(`${FURL}&models=best_match`
      + '&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure,uv_index,weather_code'
      + '&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,surface_pressure'
      + '&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,weather_code,uv_index_max'
    ).then(r => r.json()),
    // ECMWF IFS 0.25° — for model averaging
    fetch(`${FURL}&models=ecmwf_ifs025`
      + '&current=temperature_2m,wind_speed_10m,surface_pressure'
      + '&hourly=temperature_2m,wind_speed_10m'
    ).then(r => r.json()),
    // NOAA GFS 0.25° — for model averaging
    fetch(`${FURL}&models=gfs025`
      + '&current=temperature_2m,wind_speed_10m,surface_pressure'
      + '&hourly=temperature_2m,wind_speed_10m'
    ).then(r => r.json()),
    // Open-Meteo Marine — wave & sea-surface data
    fetch(`${MURL}&current=wave_height,wave_period,wave_direction,sea_surface_temperature`
      + '&hourly=wave_height,wave_period,wave_direction'
      + '&daily=wave_height_max'
    ).then(r => r.json()),
  ]);

  const f1 = r1.status==='fulfilled' && r1.value?.current ? r1.value : null;
  const f2 = r2.status==='fulfilled' && r2.value?.current ? r2.value : null;
  const f3 = r3.status==='fulfilled' && r3.value?.current ? r3.value : null;
  const fm = rm.status==='fulfilled' && rm.value?.current ? rm.value : null;

  if (!f1) return null; // primary failed → caller falls back to generateLocationData

  // Average a current field across whichever models responded
  const avgC = field => {
    const vals = [f1, f2, f3].map(d => d?.current?.[field]).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };

  // ── Averaged weather values ──
  const windSpeed  = Math.round(avgC('wind_speed_10m')  ?? 10);
  const windGust   = Math.round(f1.current.wind_gusts_10m ?? windSpeed + 5);
  const windDir    = Math.round(f1.current.wind_direction_10m ?? 0);
  const airTemp    = Math.round(avgC('temperature_2m')  ?? 18);
  const baroPres   = Math.round(avgC('surface_pressure') ?? 1013);
  const uv         = Math.round(f1.current.uv_index ?? 3);

  // Barometric trend: next 3hr from hourly surface_pressure
  const baroH = f1.hourly?.surface_pressure ?? [];
  const baroDelta = baroH.length >= 4 ? +(baroH[3] - baroH[0]).toFixed(1) : 0;
  const baroTrend = Math.abs(baroDelta) < 0.5 ? 'steady' : baroDelta > 0 ? 'rising' : 'falling';

  // ── Marine values ──
  const waveHeight  = fm?.current?.wave_height != null
    ? +(fm.current.wave_height.toFixed(1)) : 1.0;
  const swellPeriod = fm?.current?.wave_period != null
    ? Math.round(fm.current.wave_period) : 8;
  const swellDeg    = fm?.current?.wave_direction ?? 0;
  const waterTemp   = fm?.current?.sea_surface_temperature != null
    ? +(fm.current.sea_surface_temperature.toFixed(1)) : 18;

  // ── Astronomy ──
  const utcOffMin = (f1.utc_offset_seconds ?? 0) / 60;
  const sun  = computeSunTimes(lat, lng, utcOffMin);
  const moon = computeMoonPhase();

  // ── Tides & species from harmonic model (LINZ key needed for real tides) ──
  const base = generateLocationData(loc);
  const { tideState, tideHeight, nextTide, tideEvents, tide, species } = base;

  const nowH = new Date().getHours();
  const nowScore = score(windSpeed, waveHeight, nowH, waterTemp, moon.illumination, tideState==='Rising');

  // ── Find current hour index in Open-Meteo hourly array ──
  // Open-Meteo returns local-time strings like '2026-05-25T14:00'
  const todayLocal = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
  const nowKey = `${todayLocal}T${pad2(nowH)}:00`;
  const hTimes = f1.hourly?.time ?? [];
  const hi = Math.max(0, hTimes.findIndex(t => t === nowKey));

  // ── Hourly (24h from now) ──
  const hourly = Array.from({ length: 24 }, (_, i) => {
    const idx  = hi + i;
    const hr   = (nowH + i) % 24;
    const wmo  = f1.hourly?.weather_code?.[idx];
    const hWS  = Math.round(f1.hourly?.wind_speed_10m?.[idx] ?? windSpeed);
    // Average hourly temperature across models (secondary models start at index i)
    const tVals = [f1.hourly?.temperature_2m?.[idx],
                   f2?.hourly?.temperature_2m?.[i],
                   f3?.hourly?.temperature_2m?.[i]].filter(v => v != null);
    const hTemp = tVals.length ? +(tVals.reduce((a,b)=>a+b)/tVals.length).toFixed(1) : airTemp;
    const hWave = fm?.hourly?.wave_height?.[idx] ?? waveHeight;
    return {
      hour:  hr,
      label: i === 0 ? 'Now' : `${pad2(hr)}:00`,
      score: score(hWS, hWave, hr, waterTemp, moon.illumination, tideState==='Rising'),
      temp:  hTemp,
      wind:  hWS,
      cond:  wmo2cond(wmo),
    };
  });

  // ── 7-day daily ──
  const peaks = ['05:45 — 09:00','06:00 — 09:30','06:30 — 08:00','17:30 — 20:00','18:00 — 20:30'];
  const daily = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() + i);
    const hi_t  = f1.daily?.temperature_2m_max?.[i] != null ? Math.round(f1.daily.temperature_2m_max[i])  : airTemp + 2;
    const lo_t  = f1.daily?.temperature_2m_min?.[i] != null ? Math.round(f1.daily.temperature_2m_min[i])  : airTemp - 3;
    const dWind = f1.daily?.wind_speed_10m_max?.[i] != null ? Math.round(f1.daily.wind_speed_10m_max[i])  : windSpeed;
    const dWave = fm?.daily?.wave_height_max?.[i] ?? waveHeight;
    const wmo   = f1.daily?.weather_code?.[i];
    const ds    = score(dWind, dWave, 7, waterTemp, moon.illumination, true);
    return {
      day:        i===0 ? 'Today' : d.toLocaleDateString('en-US',{weekday:'short'}),
      date:       d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'}).replace(',',''),
      hi: hi_t, lo: lo_t,
      score: ds,
      peakWindow: ds > 60 ? peaks[i % 5] : '—',
      cond: wmo2cond(wmo),
    };
  });

  // ── Which sources actually responded? ──
  const dataSources = [
    'ECMWF IFS 0.25°',
    f3 ? 'NOAA GFS 0.25°' : null,
    fm ? 'Open-Meteo Marine' : null,
    'Astro (sun/moon)',
  ].filter(Boolean);

  return {
    ...base,             // tides, species, location, recentLocations
    location: loc,       // use the actual selected location name
    _live:        true,
    _dataSources: dataSources,
    now: {
      ...base.now,
      score:             nowScore,
      windSpeed, windGust, windDir,
      windDirLabel:      dir16(windDir),
      waveHeight, swellPeriod,
      swellDir:          dir8(swellDeg),
      waterTemp, airTemp,
      barometric:        baroPres,
      barometricTrend:   baroTrend,
      barometricDelta:   baroDelta,
      uv,
      uvLabel:           uvLbl(uv),
      moonPhase:         moon.phase,
      moonIllum:         moon.illumination,
      dawn:              sun.dawn,
      sunrise:           sun.sunrise,
      sunset:            sun.sunset,
      dusk:              sun.dusk,
    },
    hourly, daily,
    // tide + tideEvents unchanged (harmonic model)
  };
}

// helper: stagger entrance — each child fades & rises with delay
function StaggerList({ children, gap = 12, delay = 0 }) {
  const arr = React.Children.toArray(children);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap }}>
      {arr.map((c, i) => (
        <div key={i} style={{
          animation: `tl-stagger .55s cubic-bezier(.21,.61,.35,1) ${delay + i * 0.06}s both`,
        }}>{c}</div>
      ))}
    </div>
  );
}

function MotionTag({ children, top, left, right, bottom, anchor = 'tl', shown }) {
  if (!shown) return null;
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom,
      zIndex: 90, pointerEvents: 'none',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 9, lineHeight: 1.35,
      color: 'var(--amber)',
      background: 'rgba(10,15,30,0.85)',
      border: '1px dashed var(--amber)',
      padding: '4px 7px',
      borderRadius: 4,
      maxWidth: 160,
      backdropFilter: 'blur(8px)',
      WebkitBackdropFilter: 'blur(8px)',
      letterSpacing: 0.2,
    }}>
      <div style={{ fontWeight: 700, marginBottom: 1, fontSize: 8, opacity: 0.7 }}>
        ◆ MOTION
      </div>
      {children}
    </div>
  );
}

// ═════════════════════════════════════════════════════════════
// DASHBOARD
// ═════════════════════════════════════════════════════════════
function getBaitSuggestions(nowData, tideEvents) {
  const h = new Date().getHours();
  const month = new Date().getMonth();
  const wind  = nowData.windSpeed  || 0;
  const swell = nowData.waveHeight || 0;
  const temp  = nowData.waterTemp  || 18;
  const isDawn   = h >= 5  && h < 7;
  const isDusk   = h >= 17 && h < 20;
  const isNight  = h < 5   || h >= 20;
  const isCalm   = wind  <= 12;
  const isRough  = swell >  1.5;
  const isWarm   = temp  >= 20;
  const isCold   = temp  <  16;
  const isSummer = month === 11 || month <= 1;
  const isWinter = month >= 5   && month <= 7;
  const _nowHM2 = `${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`;
  const upcoming = (tideEvents||[]).filter(e => e.time >= _nowHM2).sort((a,b) => a.time < b.time ? -1 : 1);
  const isIncoming = upcoming[0]?.label === 'High';
  const sug = [];
  if ((isDawn||isDusk) && isCalm && !isRough)
    sug.push({ name:'Surface popper / stickbait', tag:'TOP WATER', color:'var(--amber)', reason:'Dawn & dusk trigger surface blitzes — walk-the-dog for kingfish and kahawai' });
  if (isWarm && !isRough && (isSummer || month<=2))
    sug.push({ name:'Knife jig / speed jig', tag:'PELAGIC', color:'#C77DFF', reason:'Warm water activates kingfish near the surface — drop fast, burn back up' });
  if (!isRough && isIncoming)
    sug.push({ name:'Soft bait on jig head', tag:'INCOMING TIDE', color:'var(--teal)', reason:'Incoming tide pushes bait over drop-offs — drift paddle tails with the current' });
  if (isRough || wind > 20)
    sug.push({ name:'Pilchard on ledger rig', tag:'SEEK SHELTER', color:'#7BD4F0', reason:'Rough conditions: find a sheltered bay and fish heavy sinker + fresh pilchard on the bottom' });
  if (isCold || isWinter)
    sug.push({ name:'Squid strip — slow bottom', tag:'WINTER', color:'#FF9F43', reason:'Cold water slows fish — slow presentation with squid near the seabed triggers snapper' });
  if (isNight)
    sug.push({ name:'Whole pilchard or squid', tag:'NIGHT', color:'#4D96FF', reason:'Snapper and trevally feed confidently after dark — scent beats sight' });
  sug.push({ name:'Kabura / tai rubber', tag:'RELIABLE', color:'rgba(255,255,255,0.45)', reason:'Works in almost any condition — slow spiral drop attracts snapper and trevally all year' });
  const seen = new Set();
  return sug.filter(s=>{ if(seen.has(s.name)) return false; seen.add(s.name); return true; }).slice(0,3);
}

function ConditionsBanner({ D }) {
  const hours = D.hourly || [];
  const upcoming = hours.slice(1, 21);
  if (!upcoming.length) return null;
  const best = upcoming.reduce((a, b) => (b.score > a.score ? b : a), upcoming[0]);
  if (best.score < 78) return null;
  const tone = best.score >= 88 ? 'var(--teal)' : '#F5A623';
  const emoji = best.score >= 88 ? '🎣' : '🐟';
  return (
    <div style={{
      marginBottom: 14, padding: '10px 14px', borderRadius: 12,
      background: best.score >= 88 ? 'rgba(0,201,167,0.1)' : 'rgba(245,166,35,0.1)',
      border: `1px solid ${best.score >= 88 ? 'rgba(0,201,167,0.35)' : 'rgba(245,166,35,0.35)'}`,
      display: 'flex', alignItems: 'center', gap: 10,
      animation: 'tl-stagger .5s cubic-bezier(.21,.61,.35,1) .1s both',
    }}>
      <span style={{ fontSize: 20, flexShrink: 0 }}>{emoji}</span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: tone, letterSpacing: 0.5 }}>
          PRIME WINDOW AHEAD
        </div>
        <div style={{ fontSize: 12, color: 'var(--ink)', marginTop: 2 }}>
          {best.label} &mdash; score <span style={{ color: tone, fontWeight: 700 }}>{best.score}</span>/100
          {best.wind ? ` · ${best.wind}kn wind` : ''}
          {best.swellH ? ` · ${best.swellH}m swell` : ''}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ tweaks, activeLocation, onLocationSelect, setUserGeoLoc, prefs, savedLocs = [], toggleSave, isSaved }) {
  const D = React.useContext(LocationDataCtx);
  const intensity = tweaks.glass;
  const showMotion = tweaks.motionLabels;
  const _watchFace = prefs ? prefs['Watch face'] : 'Score + tide';
  const gaugeVariant = _watchFace === 'Wind + swell' ? 'wind' : _watchFace === 'Full dashboard' ? 'arc' : tweaks.gauge;
  const n = D.now;
  const scrollRef = useRefS(null);

  // Home-screen geolocation
  // Live clock — ticks every 30s
  const [clockNow, setClockNow] = useStateS(() => new Date());
  useEffectS(() => {
    const id = setInterval(() => setClockNow(new Date()), 30000);
    return () => clearInterval(id);
  }, []);
  const _clockDate = clockNow.toLocaleDateString('en-NZ', { weekday:'short', day:'numeric', month:'short' }).toUpperCase().replace(',','');
  const _clockTime = clockNow.toLocaleTimeString('en-NZ', { hour:'2-digit', minute:'2-digit', hour12: false });
  const _clockTZ   = clockNow.toLocaleTimeString('en-US', { timeZoneName:'short' }).split(' ').pop();

  const [geoLoading, setGeoLoading] = useStateS(false);
  const detectHome = () => {
    if (!navigator.geolocation || !onLocationSelect) return;
    setGeoLoading(true);
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        if (setUserGeoLoc) setUserGeoLoc({ lat, lng });
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`, { headers: { 'Accept-Language': 'en' } });
          const d = await res.json();
          const name = d.name || d.address?.suburb || d.address?.city || d.address?.town || 'Current Location';
          const region = [d.address?.state, d.address?.country].filter(Boolean).join(', ');
          onLocationSelect({ name, region, lat, lng, score: 80 });
        } catch(e) {
          onLocationSelect({ name: 'Current Location', region: `${Math.abs(lat).toFixed(2)}°${lat<0?'S':'N'}`, lat, lng, score: 80 });
        }
        setGeoLoading(false);
      },
      () => setGeoLoading(false),
      { timeout: 12000, maximumAge: 120000 }
    );
  };
  const [pull, setPull] = useStateS(0); // 0..1 pull-to-refresh state
  const [refreshing, setRefreshing] = useStateS(false);
  const startY = useRefS(null);

  // pull to refresh handlers
  const onTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      startY.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  };
  const onTouchMove = (e) => {
    if (startY.current == null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - startY.current;
    if (dy > 0) {
      e.preventDefault?.();
      setPull(Math.min(1, dy / 120));
    }
  };
  const onTouchEnd = () => {
    if (pull > 0.7) {
      setRefreshing(true);
      setTimeout(() => { setRefreshing(false); setPull(0); }, 1600);
    } else {
      setPull(0);
    }
    startY.current = null;
  };
  useEffectS(() => {
    if (refreshing) {
      const id = setTimeout(() => setRefreshing(false), 1800);
      return () => clearTimeout(id);
    }
  }, [refreshing]);

  // hourly horizontal scroll parallax
  const hourlyRef = useRefS(null);
  const [hourlyScroll, setHourlyScroll] = useStateS(0);
  const onHourlyScroll = () => {
    if (hourlyRef.current) setHourlyScroll(hourlyRef.current.scrollLeft);
  };

  return (
    <div
      ref={scrollRef}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      onMouseDown={onTouchStart} onMouseMove={(e) => e.buttons === 1 && onTouchMove(e)} onMouseUp={onTouchEnd}
      style={{ height: '100%', overflowY: 'auto', overflowX: 'hidden', position: 'relative',
               paddingTop: 56, paddingBottom: 100, color: 'var(--ink)' }}
    >
      {/* pull-to-refresh visual */}
      <PullRefresh active={pull > 0 || refreshing} progress={pull} refreshing={refreshing} />

      {/* top hero gradient */}
      <div style={{ position: 'absolute', inset: '0 0 auto 0', height: 360,
                    background: 'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,201,167,0.15), transparent 70%)',
                    pointerEvents: 'none', zIndex: 0 }} />

      <div style={{ position: 'relative', zIndex: 1, padding: '8px 18px 0', transform: `translateY(${pull * 30}px)` }}>
        {/* location + date */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--muted)', fontSize: 12, letterSpacing: 0.5 }}>
              <svg width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.5" fill="var(--teal)"/><circle cx="6" cy="6" r="5" fill="none" stroke="var(--teal)" strokeOpacity="0.35"/></svg>
              {(activeLocation || D.location).region}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>
              <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.5 }}>{(activeLocation || D.location).name}</div>
              {activeLocation && toggleSave && (
                <button
                  onClick={() => toggleSave(activeLocation)}
                  title={isSaved && isSaved(activeLocation) ? 'Remove from saved spots' : 'Save this spot'}
                  style={{
                    background: 'none', border: 'none', cursor: 'pointer', padding: '2px 4px', flexShrink: 0,
                    color: isSaved && isSaved(activeLocation) ? 'var(--amber)' : 'rgba(255,255,255,0.25)',
                    fontSize: 20, lineHeight: 1,
                    transition: 'color .2s, transform .15s',
                    transform: isSaved && isSaved(activeLocation) ? 'scale(1.2)' : 'scale(1)',
                  }}>
                  {isSaved && isSaved(activeLocation) ? '♥' : '♡'}
                </button>
              )}
              <button onClick={detectHome} title="Use current location" style={{
                background: 'rgba(0,201,167,0.1)', border: '1px solid rgba(0,201,167,0.3)',
                borderRadius: 999, width: 28, height: 28, display: 'flex', alignItems: 'center',
                justifyContent: 'center', cursor: 'pointer', flexShrink: 0,
                opacity: geoLoading ? 0.5 : 1, transition: 'opacity .2s',
              }}>
                {geoLoading
                  ? <svg width="13" height="13" viewBox="0 0 13 13" style={{ animation: 'tl-pulse 1s infinite' }}><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="var(--teal)" strokeWidth="1.5"/></svg>
                  : <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.5" fill="var(--teal)"/><circle cx="7" cy="7" r="5.5" stroke="var(--teal)" strokeWidth="1.2"/><line x1="7" y1="0" x2="7" y2="2" stroke="var(--teal)" strokeWidth="1.2"/><line x1="7" y1="12" x2="7" y2="14" stroke="var(--teal)" strokeWidth="1.2"/><line x1="0" y1="7" x2="2" y2="7" stroke="var(--teal)" strokeWidth="1.2"/><line x1="12" y1="7" x2="14" y2="7" stroke="var(--teal)" strokeWidth="1.2"/></svg>
                }
              </button>
            </div>
          </div>
          <div style={{ textAlign: 'right', fontSize: 11, color: 'var(--muted)', letterSpacing: 0.5, lineHeight: 1.4 }}>
            {_clockDate}<br/>
            <span style={{ color: 'var(--ink)' }}>{_clockTime} {_clockTZ}</span>
          </div>
        </div>

        {/* Data source badge — shown when live API data is active */}
        {D._live && (
          <div style={{ display:'flex', gap:4, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
            <span style={{
              fontSize:8, fontWeight:700, letterSpacing:1.4, padding:'3px 8px',
              borderRadius:99, background:'rgba(0,201,167,0.15)',
              border:'1px solid rgba(0,201,167,0.45)', color:'var(--teal)',
              display:'flex', alignItems:'center', gap:4,
            }}>
              <span style={{ width:5, height:5, borderRadius:99, background:'var(--teal)',
                             display:'inline-block', animation:'tl-pulse 2s ease infinite' }}/>
              LIVE
            </span>
            {(D._dataSources||[]).map(s => (
              <span key={s} style={{
                fontSize:8, padding:'3px 8px', borderRadius:99,
                background:'rgba(255,255,255,0.05)',
                border:'1px solid rgba(255,255,255,0.1)',
                color:'var(--muted)',
              }}>{s}</span>
            ))}
          </div>
        )}

        {/* Conditions alert banner */}
        <ConditionsBanner D={D} />

        {/* Fishing Score hero */}
        <div style={{ position: 'relative', marginBottom: 8 }}>
          <FishingScore score={n.score} variant={gaugeVariant} size={232} sub="Excellent — fish on" />
          <MotionTag shown={showMotion} top={4} right={-4}>
            Gauge arc 0→{n.score}<br/>
            1400ms · ease-out-cubic<br/>
            Liquid fill loops 5–6s
          </MotionTag>
        </div>

        {/* Quick stat row pills */}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginBottom: 18, flexWrap: 'wrap' }}>
          <StatPill tone="teal">↑ {n.tideState}</StatPill>
          <StatPill tone="amber">{n.uvLabel} UV {n.uv}</StatPill>
          <StatPill>Moon {Math.round(n.moonIllum * 100)}%</StatPill>
        </div>

        {/* stat tiles */}
        <StaggerList delay={0.2}>
          <StatTilesGrid n={n} intensity={intensity} showMotion={showMotion} prefs={prefs} />
        </StaggerList>
      </div>

      {/* Hourly forecast horizontal scroll */}
      <div style={{ marginTop: 26, position: 'relative' }}>
        <SectionHeader title="Hourly outlook" hint="Bite score / hour" />
        <div ref={hourlyRef} onScroll={onHourlyScroll}
             style={{ overflowX: 'auto', overflowY: 'hidden', padding: '0 18px 8px',
                      overflowX: 'scroll', WebkitOverflowScrolling: 'touch', msOverflowStyle: 'none' }}
             className="tl-hide-scrollbar">
          <div style={{ display: 'flex', gap: 10 }}>
            {D.hourly.map((h, i) => (
              <HourCard key={i} h={h} idx={i} scroll={hourlyScroll} intensity={intensity} />
            ))}
          </div>
        </div>
        <MotionTag shown={showMotion} top={10} right={14}>
          Parallax depth<br/>
          translateZ on scroll<br/>
          ±12px @ 0.4× rate
        </MotionTag>
      </div>

      {/* 7-day */}
      <div style={{ marginTop: 26, padding: '0 18px' }}>
        <SectionHeader title="7-day outlook" hint="Peak bite windows" inset />
        <TLGlass intensity={intensity} padding={0} style={{ marginTop: 8 }}>
          {D.daily.map((d, i) => (
            <DailyRow key={i} d={d} highlight={i === 0} last={i === D.daily.length - 1} />
          ))}
        </TLGlass>
      </div>

      {/* Bait & lure suggestions */}
      {(() => {
        const baits = getBaitSuggestions(D.now, D.tideEvents);
        return (
          <div style={{ marginTop:26, padding:'0 18px' }}>
            <SectionHeader title="What's Working" hint="Conditions-based" inset />
            <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
              {baits.map((b,i) => (
                <TLGlass key={i} intensity={intensity} padding={0}
                         style={{ overflow:'hidden', animation: `tl-stagger .5s cubic-bezier(.21,.61,.35,1) ${i * 0.1}s both` }}>
                  <div style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 14px' }}>
                    <div style={{ width:40, height:40, borderRadius:10, background:`${b.color}18`, border:`1px solid ${b.color}44`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <svg width='20' height='20' viewBox='0 0 24 24' fill='none'><path d='M2 12C2 12 7 5 12 5C17 5 22 12 22 12C22 12 17 19 12 19C7 19 2 12 2 12Z' stroke='currentColor' strokeWidth='1.5'/><path d='M4 8C6 6 9 4 13 5L22 12L13 19C9 20 6 18 4 16' fill='currentColor' opacity='0.15'/><circle cx='12' cy='12' r='3' stroke='currentColor' strokeWidth='1.5'/></svg>
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
                        <span style={{ fontSize:13, fontWeight:700 }}>{b.name}</span>
                        <span style={{ fontSize:9, fontWeight:700, letterSpacing:0.8, color:b.color, background:`${b.color}18`, padding:'2px 6px', borderRadius:4 }}>{b.tag}</span>
                      </div>
                      <div style={{ fontSize:11, color:'var(--muted)', lineHeight:1.45 }}>{b.reason}</div>
                    </div>
                  </div>
                </TLGlass>
              ))}
            </div>
          </div>
        );
      })()}

      <div style={{ padding: '20px 18px', textAlign: 'center', fontSize: 10, color: 'rgba(255,255,255,0.25)', letterSpacing: 1.5 }}>
        TIDE & METOCEAN · LINZ · NIWA
      </div>
    </div>
  );
}

function PullRefresh({ active, progress, refreshing }) {
  return (
    <div style={{
      position: 'absolute', top: 8, left: 0, right: 0, height: 80,
      display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
      opacity: active || refreshing ? 1 : 0,
      transition: 'opacity .3s',
      pointerEvents: 'none', zIndex: 5,
    }}>
      <svg width="60" height="80" viewBox="0 0 60 80">
        {/* line */}
        <line x1="30" y1="0" x2="30" y2={refreshing ? 50 : 12 + progress * 38}
              stroke="rgba(0,201,167,0.5)" strokeWidth="1" strokeDasharray="2 3" />
        {/* lure */}
        <g style={{
          transform: `translateY(${refreshing ? 50 : 12 + progress * 38}px)`,
          animation: refreshing ? 'tl-lure-bob 1.4s ease-in-out infinite' : 'none',
          transformOrigin: '30px 50px',
        }}>
          <circle cx="30" cy="0" r="5" fill="var(--amber)" style={{ filter: 'drop-shadow(0 0 6px rgba(245,166,35,0.6))' }}/>
          <path d="M30 5 L 27 11 L 33 11 Z" fill="var(--amber)" />
          <path d="M28 12 L 30 18 M 32 12 L 30 18" stroke="var(--amber)" strokeWidth="1" strokeLinecap="round" />
        </g>
        {refreshing && (
          <text x="30" y="74" fontSize="8" fill="var(--teal)" textAnchor="middle"
                fontFamily="JetBrains Mono, monospace" letterSpacing="0.5">FETCHING…</text>
        )}
      </svg>
    </div>
  );
}

function SectionHeader({ title, hint, inset = false }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
      padding: inset ? 0 : '0 18px', marginBottom: 8,
    }}>
      <h3 style={{ margin: 0, fontSize: 13, letterSpacing: 1.2, textTransform: 'uppercase',
                   color: 'var(--ink)', fontWeight: 600 }}>{title}</h3>
      <span style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 1 }}>{hint}</span>
    </div>
  );
}

function StatTilesGrid({ n, intensity, showMotion, prefs }) {
  const imperial = prefs && prefs['Units'] === 'Imperial · mph · °F';
  const ktToMph = v => Math.round(v * 1.15078);
  const mToFt   = v => (v * 3.28084).toFixed(1);
  const cToF    = v => Math.round(v * 9/5 + 32);
  const tiles = [
    { icon: 'wind',  label: 'Wind',     value: imperial ? `${ktToMph(n.windSpeed)}` : `${n.windSpeed}`, unit: imperial ? 'mph' : 'kt', sub: `${n.windDirLabel} · gust ${imperial ? ktToMph(n.windGust) : n.windGust}${imperial?' mph':' kt'}`, tone: 'default' },
    { icon: 'wave',  label: 'Swell',    value: imperial ? `${mToFt(n.waveHeight)}` : `${n.waveHeight}`, unit: imperial ? 'ft' : 'm', sub: `${n.swellPeriod}s ${n.swellDir}`, tone: 'default' },
    { icon: 'water', label: 'Water',    value: imperial ? `${cToF(n.waterTemp)}` : `${n.waterTemp}`, unit: imperial ? '°F' : '°C', sub: `Air ${imperial ? cToF(n.airTemp) : n.airTemp}°`, tone: 'default' },
    { icon: 'tide',  label: 'Tide',     value: imperial ? `${mToFt(n.tideHeight)}` : `${n.tideHeight}`, unit: imperial ? 'ft' : 'm', sub: `${n.nextTide}`, tone: 'teal' },
    { icon: 'baro',  label: 'Pressure', value: `${n.barometric}`, unit: 'hPa', sub: null, tone: 'default', pressure: true, trend: n.barometricTrend, delta: n.barometricDelta },
    { icon: 'uv',    label: 'UV',       value: `${n.uv}`, unit: n.uvLabel, sub: 'Peak 13:20', tone: 'amber' },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, position: 'relative' }}>
      {tiles.map((t, i) => <StatTile key={i} {...t} intensity={intensity} idx={i} />)}
      <MotionTag shown={showMotion} top={-2} left={-130} bottom={undefined}>
        Cards stagger up<br/>
        translateY 14→0<br/>
        60ms apart · 550ms
      </MotionTag>
    </div>
  );
}

function StatTile({ icon, label, value, unit, sub, tone = 'default', intensity, idx, pressure, trend, delta }) {
  const toneColor = tone === 'teal' ? 'var(--teal)' : tone === 'amber' ? 'var(--amber)' : 'var(--ink)';
  return (
    <TLGlass intensity={intensity} padding={10}
             style={{ minHeight: 88, animation: `tl-stagger .55s cubic-bezier(.21,.61,.35,1) ${idx * 0.07}s both` }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
        <span style={{ fontSize: 9, letterSpacing: 1, textTransform: 'uppercase', color: 'var(--muted)', fontWeight: 600 }}>
          {label}
        </span>
        <TileIcon kind={icon} color={toneColor} />
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 3 }}>
        <span style={{ fontFamily: '"Inter Tight", Inter, system-ui',
                       fontSize: 24, fontWeight: 700, letterSpacing: -1, color: toneColor,
                       fontVariantNumeric: 'tabular-nums' }}>{value}</span>
        <span style={{ fontSize: 10, color: 'var(--muted)', fontWeight: 600 }}>{unit}</span>
      </div>
      {pressure ? (
        <div style={{ marginTop: 4 }}>
          <PressureArrow trend={trend} delta={delta} />
        </div>
      ) : sub ? (
        <div style={{ marginTop: 4, fontSize: 10, color: 'var(--muted)' }}>{sub}</div>
      ) : null}
    </TLGlass>
  );
}

function TileIcon({ kind, color = 'currentColor', size = 14 }) {
  const stroke = { fill: 'none', stroke: color, strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (kind) {
    case 'wind':  return <svg width={size} height={size} viewBox="0 0 16 16"><path d="M2 6h7a2 2 0 1 0-2-2M2 10h11a2 2 0 1 1-2 2M2 8h5" {...stroke}/></svg>;
    case 'wave':  return <svg width={size} height={size} viewBox="0 0 16 16"><path d="M1 8c2 -2 4 -2 6 0s4 2 6 0s2 0 2 0M1 12c2 -2 4 -2 6 0s4 2 6 0s2 0 2 0" {...stroke}/></svg>;
    case 'water': return <svg width={size} height={size} viewBox="0 0 16 16"><path d="M8 2c -3 4 -5 7 -5 9a5 5 0 0 0 10 0c0 -2 -2 -5 -5 -9z" {...stroke}/></svg>;
    case 'tide':  return <svg width={size} height={size} viewBox="0 0 16 16"><path d="M1 11h14M3 11l3 -5l4 5l3 -3" {...stroke}/></svg>;
    case 'baro':  return <svg width={size} height={size} viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" {...stroke}/><path d="M8 8l3 -3" {...stroke}/></svg>;
    case 'uv':    return <svg width={size} height={size} viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" {...stroke}/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5 -1.5M11.5 4.5L13 3" {...stroke}/></svg>;
    case 'moon':  return <svg width={size} height={size} viewBox="0 0 16 16"><path d="M11 2a6 6 0 1 0 3 11A5 5 0 0 1 11 2z" {...stroke}/></svg>;
    default: return null;
  }
}

function HourCard({ h, idx, scroll, intensity }) {
  // parallax depth: each card translates based on offset from current scroll
  const cardW = 72, gap = 10;
  const cardCenter = idx * (cardW + gap) + cardW / 2;
  const viewCenter = scroll + 170; // ~half view width
  const offset = (cardCenter - viewCenter);
  const parallax = -offset * 0.05;
  const depth = Math.max(0.7, 1 - Math.abs(offset) / 600);
  const tone = h.score >= 75 ? 'var(--teal)' : h.score >= 55 ? '#7BD4F0' : 'var(--muted)';
  const floatStyle = h.score >= 78 ? { animation: 'tl-float 2.6s ease-in-out infinite' } : {};
  return (
    <div style={{
      transform: `translateX(${parallax}px) translateZ(0) scale(${depth})`,
      transition: 'transform 80ms linear',
      opacity: depth,
      animation: `tl-stagger .45s cubic-bezier(.21,.61,.35,1) ${Math.min(idx * 0.04, 0.6)}s both`,
    }}>
      <TLGlass intensity={intensity} padding={10} style={{
        width: cardW, textAlign: 'center', position: 'relative',
        ...(idx === 0 ? { border: '1px solid rgba(245,166,35,0.4)' } : {}),
      }}>
        {idx === 0 && <NowDot />}
        <div style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: 0.5, fontWeight: 600 }}>
          {h.label.toUpperCase()}
        </div>
        <div style={{ margin: '8px 0 4px', display: 'flex', justifyContent: 'center' }}>
          <WeatherIcon cond={h.cond} size={28} />
        </div>
        <div style={{ fontFamily: '"Inter Tight", Inter', fontSize: 18, fontWeight: 700, color: 'var(--ink)' }}>
          {h.temp}°
        </div>
        <div style={{ marginTop: 6, height: 3, background: 'rgba(255,255,255,0.06)', borderRadius: 2, overflow: 'hidden' }}>
          <div style={{ width: `${h.score}%`, height: '100%', background: tone,
                        boxShadow: `0 0 4px ${tone}` }}/>
        </div>
        <div style={{ marginTop: 4, fontSize: 9, color: tone, fontWeight: 600 }}>{h.score}</div>
      </TLGlass>
    </div>
  );
}

function NowDot() {
  return (
    <span style={{
      position: 'absolute', top: -4, right: -4,
      display: 'flex', alignItems: 'center', gap: 3,
      padding: '2px 6px', background: 'var(--amber)',
      color: 'var(--bg)', fontSize: 8, fontWeight: 800, letterSpacing: 0.5,
      borderRadius: 999,
      boxShadow: '0 0 10px rgba(245,166,35,0.7)',
    }}>
      <span style={{ width: 4, height: 4, borderRadius: 999, background: 'var(--bg)',
                     animation: 'tl-pulse 1.4s infinite ease-in-out' }}/>
      NOW
    </span>
  );
}

function DailyRow({ d, highlight, last }) {
  const tone = d.score >= 75 ? 'var(--teal)' : d.score >= 55 ? '#7BD4F0' : 'var(--amber)';
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: '60px 28px 1fr 70px 50px', alignItems: 'center', gap: 10,
      padding: '12px 14px', borderBottom: last ? 'none' : '1px solid rgba(255,255,255,0.04)',
      ...(highlight ? { background: 'linear-gradient(90deg, rgba(0,201,167,0.04), transparent)' } : {}),
    }}>
      <div>
        <div style={{ fontWeight: 600, fontSize: 13, color: 'var(--ink)' }}>{d.day}</div>
        <div style={{ fontSize: 10, color: 'var(--muted)' }}>{d.date}</div>
      </div>
      <WeatherIcon cond={d.cond} size={22} />
      <div style={{ fontSize: 10, color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 4 }}>
        {d.peakWindow !== '—' && <span style={{ width: 5, height: 5, borderRadius: 999, background: 'var(--amber)', boxShadow: '0 0 6px var(--amber)' }} />}
        {d.peakWindow}
      </div>
      <div style={{ fontSize: 11, color: 'var(--muted)', textAlign: 'right' }}>
        <span style={{ color: 'var(--ink)' }}>{d.hi}°</span> <span>{d.lo}°</span>
      </div>
      <div style={{ textAlign: 'right' }}>
        <span style={{
          display: 'inline-block', padding: '3px 7px', background: `${tone === 'var(--teal)' ? 'rgba(0,201,167,0.15)' : tone === '#7BD4F0' ? 'rgba(123,212,240,0.15)' : 'rgba(245,166,35,0.15)'}`,
          color: tone, borderRadius: 6, fontSize: 11, fontWeight: 700,
          fontVariantNumeric: 'tabular-nums', minWidth: 30, textAlign: 'center',
        }}>{d.score}</span>
      </div>
    </div>
  );
}

function Conditions({ tweaks, activeLocation, prefs }) {
  const D = React.useContext(LocationDataCtx);
  const intensity = tweaks.glass;
  const showMotion = tweaks.motionLabels;
  const n = D.now;
  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 56, paddingBottom: 100, color: 'var(--ink)' }}>
      <div style={{ padding: '8px 18px 0' }}>
        <ScreenTitle eyebrow="Detailed conditions" title={`Now off ${activeLocation ? activeLocation.name : D.location.name}`} />

        {/* Wind */}
        <StaggerList>
          <TLGlass intensity={intensity} padding={16} style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
              <SubTitle icon="wind">Wind</SubTitle>
              <StatPill tone="teal">Light–moderate</StatPill>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, alignItems: 'center' }}>
              <WindCompass bearing={n.windDir} speed={n.windSpeed} gust={n.windGust} size={150} />
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {(() => {
                  const imp = prefs && prefs['Units'] === 'Imperial · mph · °F';
                  const spd = imp ? Math.round(n.windSpeed * 1.15078) : n.windSpeed;
                  const gst = imp ? Math.round(n.windGust * 1.15078) : n.windGust;
                  const u = imp ? 'mph' : 'kt';
                  return (<>
                    <BigMetric value={spd} unit={u} label={`${n.windDirLabel} · ${n.windDir}°`} />
                    <SmallStat label="Gust" value={`${gst} ${u}`} />
                    <SmallStat label="6h trend" value="Easing" tone="teal" />
                    <SmallStat label="Forecast peak" value={`${imp?Math.round(14*1.15078):14} ${u} · 13:00`} />
                  </>);
                })()}
              </div>
            </div>
            <MotionTag shown={showMotion} top={70} right={4}>
              Compass needle<br/>
              Spring k=0.06 d=0.18<br/>
              Overshoots → settles
            </MotionTag>
          </TLGlass>

          {/* Tide */}
          <TLGlass intensity={intensity} padding={16} style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <SubTitle icon="tide">Tides</SubTitle>
              <span style={{ fontSize: 11, color: 'var(--muted)' }}>{new Date().toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})} · LINZ</span>
            </div>
            <TideChart data={D.tide} events={D.tideEvents} nowIdx={Math.min(47, Math.round(new Date().getHours() * 2))} />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 4, marginTop: 12 }}>
              {D.tideEvents.map(e => (
                <div key={e.time} style={{ textAlign: 'center', padding: 6, background: 'rgba(255,255,255,0.03)', borderRadius: 8 }}>
                  <div style={{ fontSize: 9, color: 'var(--muted)', letterSpacing: 1 }}>{e.label.toUpperCase()}</div>
                  <div style={{ fontWeight: 700, fontSize: 13, marginTop: 2, fontFamily: '"Inter Tight",Inter' }}>{e.time}</div>
                  <div style={{ fontSize: 9, color: 'var(--teal)' }}>{e.height}m</div>
                </div>
              ))}
            </div>
            <MotionTag shown={showMotion} top={36} left={-100}>
              Tide curve<br/>
              Perpetual SVG path<br/>
              undulation ±3px · 4s loop
            </MotionTag>
          </TLGlass>

          {/* Swell + moon split */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <TLGlass intensity={intensity} padding={14}>
              <SubTitle icon="wave">Swell</SubTitle>
              {(() => {
                const imp = prefs && prefs['Units'] === 'Imperial · mph · °F';
                const h = imp ? (n.waveHeight * 3.28084).toFixed(1) : n.waveHeight;
                return <BigMetric value={h} unit={imp?'ft':'m'} label={`${n.swellPeriod}s · ${n.swellDir}`} style={{ marginTop: 6 }} />;
              })()}
              <div style={{ marginTop: 14 }}>
                {/* swell amp meter */}
                <svg width="100%" height="50" viewBox="0 0 100 50" preserveAspectRatio="none"
                     style={{ overflow:'visible' }}>
                  <path d="M0 30 Q 12 20, 25 30 T 50 30 T 75 30 T 100 30 L 100 50 L 0 50 Z"
                        fill="rgba(0,201,167,0.18)" className="tl-tide-undulate"
                        style={{ animationDuration:'3.6s', animationDelay:'.4s' }}/>
                  <path d="M0 30 Q 12 20, 25 30 T 50 30 T 75 30 T 100 30"
                        fill="none" stroke="var(--teal)" strokeWidth="1.5"
                        className="tl-tide-undulate"
                        style={{ filter:'drop-shadow(0 0 5px var(--teal))',
                                 animationDuration:'3.6s',
                                 animation:'tl-tide-undulate 3.6s ease-in-out infinite, tl-drawpath .9s ease .2s both' }}/>
                </svg>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4, fontSize: 9, color: 'var(--muted)' }}>
                  <span>Wind wave 0.4m</span><span>Primary 1.2m</span>
                </div>
              </div>
            </TLGlass>
            <TLGlass intensity={intensity} padding={14}>
              <SubTitle icon="moon">Moon</SubTitle>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 4 }}>
                <MoonPhase illum={n.moonIllum} size={56} />
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{n.moonPhase}</div>
                  <div style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{Math.round(n.moonIllum * 100)}% illum.</div>
                </div>
              </div>
              <div style={{ marginTop: 14, fontSize: 10, color: 'var(--muted)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>Rise</span><span style={{ color: 'var(--ink)', fontWeight: 600 }}>15:42</span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
                  <span>Set</span><span style={{ color: 'var(--ink)', fontWeight: 600 }}>04:18</span>
                </div>
              </div>
            </TLGlass>
          </div>

          {/* Pressure */}
          <TLGlass intensity={intensity} padding={16} style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <SubTitle icon="baro">Barometric pressure</SubTitle>
              <PressureArrow trend={n.barometricTrend} delta={n.barometricDelta} size={20} />
            </div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 8 }}>
              <span style={{ fontFamily: '"Inter Tight",Inter', fontSize: 38, fontWeight: 700, letterSpacing: -1.5,
                             fontVariantNumeric: 'tabular-nums' }}>{n.barometric}</span>
              <span style={{ color: 'var(--muted)', fontSize: 13 }}>hPa</span>
            </div>
            {/* 24h sparkline */}
            <svg width="100%" height="38" viewBox="0 0 200 38" preserveAspectRatio="none" style={{ marginTop: 8 }}>
              <path d="M0 22 L 20 24 L 40 26 L 60 22 L 80 18 L 100 14 L 120 12 L 140 10 L 160 9 L 180 7 L 200 6"
                    fill="none" stroke="var(--teal)" strokeWidth="1.5"
                    style={{ filter: 'drop-shadow(0 0 4px rgba(0,201,167,0.4))' }}/>
              <circle cx="200" cy="6" r="3" fill="var(--teal)"/>
            </svg>
            <div style={{ marginTop: 4, fontSize: 11, color: 'var(--muted)' }}>
              {n.barometricTrend === 'rising'
                ? <span>Rising steadily — classic post-front pattern. Fish typically <span style={{ color: 'var(--teal)' }}>respond well</span> 6–18h after.</span>
                : n.barometricTrend === 'falling'
                ? <span>Falling — pre-front pressure drop. Fish often <span style={{ color: 'var(--teal)' }}>feed aggressively</span> in the hours just ahead.</span>
                : <span>Holding steady — stable conditions favour <span style={{ color: 'var(--teal)' }}>consistent fishing</span> throughout the day.</span>
              }
            </div>
            <MotionTag shown={showMotion} top={14} right={120}>
              Pressure arrow<br/>
              Rotates -45° (rising)<br/>
              Glow scales w/ |Δ|
            </MotionTag>
          </TLGlass>

          {/* Sun */}
          <TLGlass intensity={intensity} padding={14}>
            <SubTitle icon="uv">Sun & light</SubTitle>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 6, marginTop: 10 }}>
              {(() => {
                const is12 = prefs && prefs['Time format'] === '12-hour';
                const fmt = t => { if (!t || !is12) return t; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')}${h>=12?'pm':'am'}`; };
                return [
                  ['Dawn', n.dawn], ['Sunrise', n.sunrise], ['Sunset', n.sunset], ['Dusk', n.dusk],
                ].map(([k, v]) => (
                  <div key={k} style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 9, color: 'var(--muted)', letterSpacing: 1 }}>{k.toUpperCase()}</div>
                    <div style={{ fontWeight: 700, fontSize: 13, marginTop: 2, fontFamily: '"Inter Tight",Inter' }}>{fmt(v)}</div>
                  </div>
                ));
              })()}
            </div>
          </TLGlass>
        </StaggerList>
      </div>
    </div>
  );
}

function ScreenTitle({ eyebrow, title }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: 'uppercase', color: 'var(--teal)' }}>{eyebrow}</div>
      <h1 style={{ margin: '4px 0 0', fontSize: 26, fontWeight: 700, letterSpacing: -0.7 }}>{title}</h1>
    </div>
  );
}

function SubTitle({ icon, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      {icon && <TileIcon kind={icon} size={16} color="var(--teal)" />}
      <h3 style={{ margin: 0, fontSize: 13, letterSpacing: 1.2, textTransform: 'uppercase', fontWeight: 600 }}>{children}</h3>
    </div>
  );
}

function BigMetric({ value, unit, label, style = {} }) {
  return (
    <div style={style}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
        <span key={String(value)}
              style={{ fontFamily: '"Inter Tight",Inter', fontSize: 36, fontWeight: 700, letterSpacing: -1.5,
                       fontVariantNumeric: 'tabular-nums',
                       animation: 'tl-value-in .5s cubic-bezier(.34,1.56,.64,1) both' }}>{value}</span>
        <span style={{ color: 'var(--muted)', fontSize: 12 }}>{unit}</span>
      </div>
      {label && <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: -2 }}>{label}</div>}
    </div>
  );
}

function SmallStat({ label, value, tone }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  fontSize: 11, padding: '6px 0', borderTop: '1px solid rgba(255,255,255,0.04)' }}>
      <span style={{ color: 'var(--muted)' }}>{label}</span>
      <span style={{ color: tone === 'teal' ? 'var(--teal)' : 'var(--ink)', fontWeight: 600 }}>{value}</span>
    </div>
  );
}

Object.assign(window, { Dashboard, Conditions, MotionTag, StaggerList, SectionHeader, SubTitle, ScreenTitle, TileIcon });

function Catch({ tweaks }) {
  const D = React.useContext(LocationDataCtx);
  const intensity = tweaks.glass;
  const [activeId, setActiveId] = React.useState('snapper');
  const species = D.species;
  const active = species.find(s => s.id === activeId) || species[0];
  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 56, paddingBottom: 100, color: 'var(--ink)' }}>
      <div style={{ padding: '8px 18px 0' }}>
        <ScreenTitle eyebrow="Catch Forecast" title="Bite windows · 24h" />
        <div style={{ margin: '0 -18px' }}>
          <div className="tl-hide-scrollbar" style={{ overflowX: 'scroll', WebkitOverflowScrolling: 'touch', padding: '4px 18px 12px' }}>
            <div style={{ display: 'flex', gap: 8 }}>
              {species.map(s => (
                <SpeciesChip key={s.id} sp={s} active={s.id === activeId} onClick={() => setActiveId(s.id)} />
              ))}
            </div>
          </div>
        </div>
        <TLGlass intensity={intensity} padding={18} style={{ marginTop: 4 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: 'var(--muted)', letterSpacing: 0.5, fontStyle: 'italic' }}>{active.maori}</div>
              <h2 style={{ margin: '2px 0 0', fontSize: 24, letterSpacing: -0.6, fontWeight: 700 }}>{active.name}</h2>
              <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
                <StatPill>{active.depthRange}</StatPill>
                <StatPill tone={active.conf === 'High' ? 'teal' : 'amber'}>{active.conf} conf.</StatPill>
              </div>
            </div>
            <ScoreBubble score={active.score} />
          </div>
          <div style={{ marginTop: 22 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
              <span style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: 'var(--muted)' }}>Bite timeline</span>
              <span style={{ fontSize: 10, color: 'var(--muted)' }}>00 · 06 · 12 · 18 · 24</span>
            </div>
            <BiteTimeline windows={active.windows} nowHour={new Date().getHours() + new Date().getMinutes()/60} />
          </div>
          <div style={{ marginTop: 16, padding: '10px 12px', background: 'rgba(0,201,167,0.06)', border: '1px solid rgba(0,201,167,0.18)', borderRadius: 12, fontSize: 12, lineHeight: 1.45, color: 'rgba(255,255,255,0.85)' }}>
            <span style={{ color: 'var(--teal)', fontWeight: 700, marginRight: 6 }}>◆</span>
            {active.note}
          </div>
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: 'var(--muted)', marginBottom: 6 }}>Today's peak windows</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {active.windows.filter(w => w.level === 'hot').map((w, i) => <PeakWindow key={i} window={w} />)}
              {active.windows.filter(w => w.level === 'hot').length === 0 && (
                <div style={{ fontSize: 12, color: 'var(--muted)', fontStyle: 'italic', padding: '6px 0' }}>No peak windows today — consider rescheduling.</div>
              )}
            </div>
          </div>
        </TLGlass>
        <div style={{ marginTop: 24 }}>
          <SectionHeader title="Other species" hint="Tap to switch" inset />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 10 }}>
            {species.filter(s => s.id !== activeId).map(s => <SpeciesRow key={s.id} sp={s} onClick={() => setActiveId(s.id)} intensity={intensity} />)}
          </div>
        </div>
        <div style={{ marginTop: 22, fontSize: 10, color: 'rgba(255,255,255,0.3)', lineHeight: 1.6, padding: '0 4px' }}>
          Bite scores combine solunar tables, barometric movement, tidal flow, water temp vs species range, and 5y historical catch data. ±15% variance.
        </div>
      </div>
    </div>
  );
}

function SpeciesChip({ sp, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      flexShrink: 0, display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px 8px 10px',
      background: active ? 'rgba(0,201,167,0.13)' : 'rgba(255,255,255,0.03)',
      border: `1px solid ${active ? 'var(--teal)' : 'rgba(255,255,255,0.08)'}`,
      borderRadius: 999, cursor: 'pointer', color: 'inherit', transition: 'all .22s ease',
      transform: active ? 'translateY(-1px)' : 'none',
      boxShadow: active ? '0 4px 12px -4px rgba(0,201,167,0.5)' : 'none', fontFamily: 'Inter, system-ui',
    }}>
      <FishIcon id={sp.id} width={28} color={active ? 'var(--teal)' : 'rgba(255,255,255,0.55)'} active={active}/>
      <span style={{ fontSize: 12, fontWeight: 600, color: active ? 'var(--ink)' : 'var(--muted)' }}>{sp.name}</span>
      <span style={{ fontSize: 10, fontWeight: 700, color: active ? 'var(--teal)' : 'rgba(255,255,255,0.4)', fontVariantNumeric: 'tabular-nums' }}>{sp.score}</span>
    </button>

}

function ScoreBubble({ score }) {
  const tone = score >= 80 ? 'var(--teal)' : score >= 60 ? '#7BD4F0' : 'var(--amber)';
  return (
    <div style={{ width: 70, height: 70, borderRadius: 999, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.06), transparent 60%)', border: `1.5px solid ${tone}`, boxShadow: `0 0 18px ${tone}55, inset 0 0 14px rgba(255,255,255,0.04)` }}>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: '"Inter Tight",Inter', fontSize: 26, fontWeight: 700, color: tone, letterSpacing: -1, fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>{score}</div>
        <div style={{ fontSize: 8, color: 'var(--muted)', letterSpacing: 1, marginTop: 2 }}>SCORE</div>
      </div>
    </div>
  );
}

function BiteTimeline({ windows, nowHour = 9.25 }) {
  const colors = {
    hot:  { bg: 'linear-gradient(180deg,rgba(0,201,167,0.85),rgba(0,201,167,0.45))', glow: 'rgba(0,201,167,0.55)', label: 'HOT' },
    warm: { bg: 'linear-gradient(180deg,rgba(123,212,240,0.7),rgba(123,212,240,0.35))', glow: 'rgba(123,212,240,0.4)', label: 'WARM' },
    slow: { bg: 'linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02))', glow: 'transparent', label: 'SLOW' },
  };
  return (
    <div>
      <div style={{ position: 'relative', height: 56, background: 'rgba(255,255,255,0.03)', borderRadius: 10, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.05)' }}>
        {[0,6,12,18,24].map(h => <div key={h} style={{ position: 'absolute', top: 0, bottom: 0, left: `${(h/24)*100}%`, width: 1, background: 'rgba(255,255,255,0.06)' }} />)}
        {windows.map((w, i) => {
          const c = colors[w.level] || colors.slow;
          return <div key={i} style={{ position: 'absolute', left: `${(w.start/24)*100}%`, width: `${((w.end-w.start)/24)*100}%`, top: 8, bottom: 8, borderRadius: 4, background: c.bg, boxShadow: `0 0 12px ${c.glow}`, animation: `tl-band-in .9s cubic-bezier(.21,.61,.35,1) ${i*0.06}s both`, transformOrigin: 'left center' }} />;
        })}
        <div style={{ position: 'absolute', top: -4, bottom: -4, left: `${(nowHour/24)*100}%`, width: 2, background: 'var(--amber)', boxShadow: '0 0 12px var(--amber)' }}>
          <div style={{ position: 'absolute', top: -10, left: '50%', transform: 'translateX(-50%)', background: 'var(--amber)', color: 'var(--bg)', fontSize: 8, fontWeight: 800, padding: '2px 5px', borderRadius: 3, letterSpacing: 0.5 }}>NOW</div>
        </div>
      </div>

      </div>

        {['hot','warm','slow'].map(k => {

        })}
      </div>
    </div>
  );
}

async function generateShareCard(entry, sp) {
  const W = 1080, H = 580;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  await document.fonts.ready;

  // ── Rounded rect helper ──
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y,   x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x,   y+h, x,   y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x,   y,   x+r, y);
    ctx.closePath();
  }

  // ── Pill badge helper — returns badge width ──
  function badge(text, x, y, color) {
    ctx.font = 'bold 30px Inter,system-ui';
    const tw = ctx.measureText(text).width;
    const bh = 50, px = 22, r = 25;
    const bw = tw + px * 2;
    rrect(x, y, bw, bh, r);
    ctx.fillStyle = color + '28'; ctx.fill();
    ctx.strokeStyle = color + '80'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + px, y + bh / 2);
    return bw;
  }

  // ══════════════════════════════════════════
  // BACKGROUND
  // ══════════════════════════════════════════
  if (entry.photo) {
    // Full-bleed photo
    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.max(W / img.width, H / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
        resolve();
      };
      img.src = entry.photo;
    });
    // Cinematic scrim — light at top, heavy at bottom
    const scrim = ctx.createLinearGradient(0, 0, 0, H);
    scrim.addColorStop(0,    'rgba(5,10,22,0.18)');
    scrim.addColorStop(0.38, 'rgba(5,10,22,0.08)');
    scrim.addColorStop(0.62, 'rgba(5,10,22,0.55)');
    scrim.addColorStop(1,    'rgba(5,10,22,0.97)');
    ctx.fillStyle = scrim; ctx.fillRect(0, 0, W, H);
    // Edge vignettes
    const lv = ctx.createLinearGradient(0, 0, 180, 0);
    lv.addColorStop(0, 'rgba(5,10,22,0.65)'); lv.addColorStop(1, 'rgba(5,10,22,0)');
    ctx.fillStyle = lv; ctx.fillRect(0, 0, 180, H);
    const rv = ctx.createLinearGradient(W - 130, 0, W, 0);
    rv.addColorStop(0, 'rgba(5,10,22,0)'); rv.addColorStop(1, 'rgba(5,10,22,0.7)');
    ctx.fillStyle = rv; ctx.fillRect(W - 130, 0, 130, H);
  } else {
    // No photo: rich dark gradient
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#060B19'); bg.addColorStop(1, '#10182C');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // Fine grid
    ctx.strokeStyle = 'rgba(0,201,167,0.055)'; ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += 44) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 44) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // Species colour radial bloom left-of-centre
    const bloom = ctx.createRadialGradient(300, H * 0.5, 0, 300, H * 0.5, 420);
    bloom.addColorStop(0,   sp.color + '60');
    bloom.addColorStop(0.5, sp.color + '22');
    bloom.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = bloom; ctx.fillRect(0, 0, W, H);
    // Large watermark letter
    ctx.font = 'bold 440px Inter,system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = sp.color + '16';
    ctx.fillText(sp.name[0], 280, H / 2 + 28);
  }

  // ══════════════════════════════════════════
  // OVERLAY DECORATION
  // ══════════════════════════════════════════

  // Teal radial glow along the bottom
  const tg = ctx.createRadialGradient(W * 0.42, H + 60, 0, W * 0.42, H + 60, 340);
  tg.addColorStop(0, 'rgba(0,201,167,0.28)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tg; ctx.fillRect(0, H - 220, W, 220);

  // Left accent bar — gradient fade top/bottom
  const bar = ctx.createLinearGradient(0, 0, 0, H);
  bar.addColorStop(0,   'rgba(0,201,167,0.3)');
  bar.addColorStop(0.4, 'rgba(0,201,167,1)');
  bar.addColorStop(0.7, 'rgba(0,201,167,1)');
  bar.addColorStop(1,   'rgba(0,201,167,0.3)');
  ctx.fillStyle = bar; ctx.fillRect(0, 0, 6, H);

  // Top-right: "TIGHT LINES" label
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 15px Inter,system-ui';
  ctx.letterSpacing = '2px';
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillText('TIGHT LINES', W - 42, 50);
  ctx.letterSpacing = '0px';

  // Small fish icon top-right (SVG-style path, scaled)
  ctx.save();
  ctx.translate(W - 104, 30);
  ctx.scale(0.85, 0.85);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(4, 12); ctx.bezierCurveTo(14,4, 28,8, 34,12);
  ctx.bezierCurveTo(28,16, 14,20, 4,12);
  ctx.moveTo(4,12); ctx.lineTo(-4,6); ctx.moveTo(4,12); ctx.lineTo(-4,18);
  ctx.stroke();
  ctx.restore();

  // ══════════════════════════════════════════
  // TEXT CONTENT — bottom-left
  // ══════════════════════════════════════════
  ctx.textAlign = 'left';
  const tx = 48;
  let ty = H - 210;

  // Species name with text shadow
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 2;
  ctx.font = 'bold 84px Inter,system-ui';
  ctx.fillStyle = '#FFFFFF';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(sp.name, tx, ty);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ty += 16;

  // Māori name
  if (sp.maori) {
    ctx.font = 'italic 27px Inter,system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fillText(sp.maori, tx + 2, ty + 28);
    ty += 54;
  } else { ty += 34; }

  ty += 20;

  // Stat badges
  ctx.textBaseline = 'middle';
  let bx = tx;
  if (entry.length) { bx += badge(entry.length + ' cm', bx, ty, 'rgba(0,201,167,1)') + 12; }
  if (entry.weight) { badge(entry.weight + ' kg', bx, ty, 'rgba(245,166,35,1)'); }
  ty += 68;

  // Location · Date line
  ctx.textBaseline = 'alphabetic';
  ctx.font = '400 20px Inter,system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.48)';
  const parts = [];
  if (entry.location) parts.push('\u{1F4CD} ' + entry.location);
  if (entry.date) parts.push(new Date(entry.date).toLocaleDateString('en-NZ', { day:'numeric', month:'long', year:'numeric' }));
  if (parts.length) {
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 12;
    ctx.fillText(parts.join('  ·  '), tx, ty);
    ctx.shadowBlur = 0;
  }

  // Bottom gradient rule
  const rule = ctx.createLinearGradient(0, 0, W, 0);
  rule.addColorStop(0,   'rgba(0,201,167,0)');
  rule.addColorStop(0.25,'rgba(0,201,167,0.9)');
  rule.addColorStop(0.75,'rgba(0,201,167,0.9)');
  rule.addColorStop(1,   'rgba(0,201,167,0)');
  ctx.fillStyle = rule; ctx.fillRect(0, H - 3, W, 3);

  return c.toDataURL('image/png');
}

function CatchCard({ entry, intensity, expanded, onToggle, onDelete }) {
  const sp = LOG_SPECIES.find(s => s.id === entry.species) || { name: entry.species || 'Fish', color:'#7B8FA1', maori:'' };
  const d = entry.date ? new Date(entry.date) : null;
  const dateStr = d ? d.toLocaleDateString('en-NZ', { weekday:'short', day:'numeric', month:'short' }) : '';
  const timeStr = d ? d.toLocaleTimeString('en-NZ', { hour:'2-digit', minute:'2-digit' }) : '';
  const [confirmDel, setConfirmDel] = React.useState(false);
  const [sharing, setSharing] = React.useState(false);
  const handleShare = async () => {
    setSharing(true);
    try {
      const dataUrl = await generateShareCard(entry, sp);
      if (navigator.share) {
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          const file = new File([blob], 'tight-lines-catch.png', { type:'image/png' });
          if (navigator.canShare && navigator.canShare({ files:[file] })) {
            await navigator.share({ files:[file], title:`${sp.name} \u2014 Tight Lines` });
            return;
          }
        } catch(e) {}
      }
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `tight-lines-${sp.name.toLowerCase().replace(/\s+/g,'-')}.png`;
      a.click();
    } finally { setSharing(false); }
  };

  return (
    <TLGlass intensity={intensity} padding={0} style={{ overflow:'hidden' }}>
      <button onClick={onToggle} style={{
        width:'100%', background:'none', border:'none', cursor:'pointer',
        padding:'14px 16px', display:'flex', alignItems:'center', gap:14,
        color:'inherit', textAlign:'left', fontFamily:'Inter,system-ui',
      }}>
        {/* Fish visual */}
        <div style={{
          width:64, height:64, borderRadius:16, flexShrink:0,
          background:`${sp.color}18`, border:`1.5px solid ${sp.color}44`,
          display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden',
        }}>
          {entry.photo
            ? <img src={entry.photo} style={{ width:'100%', height:'100%', objectFit:'cover' }} alt="catch"/>
            : <FishIcon id={entry.species} width={46} color={sp.color} active={true}/>
          }
        </div>
        {/* Info */}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:6, flexWrap:'wrap' }}>
            <span style={{ fontSize:16, fontWeight:700 }}>{sp.name}</span>
            {sp.maori && <span style={{ fontSize:10, color:'var(--muted)', fontStyle:'italic' }}>{sp.maori}</span>}
          </div>
          <div style={{ display:'flex', gap:10, marginTop:4 }}>
            {entry.length && <span style={{ fontSize:13, color:'var(--teal)', fontWeight:700, fontVariantNumeric:'tabular-nums' }}>{entry.length} cm</span>}
            {entry.weight && <span style={{ fontSize:13, color:'var(--amber)', fontWeight:700, fontVariantNumeric:'tabular-nums' }}>{entry.weight} kg</span>}
          </div>
          <div style={{ fontSize:10, color:'var(--muted)', marginTop:4, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            {dateStr}{timeStr && ` · ${timeStr}`}{entry.location && ` · ${entry.location}`}
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink:0, transition:'transform .2s', transform: expanded?'rotate(180deg)':'none' }}>
          <path d="M4 6l4 4 4-4" stroke="var(--muted)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>

      {expanded && (
        <div style={{ padding:'0 16px 14px', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
          {entry.notes && (
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.7)', lineHeight:1.6, padding:'10px 0 8px' }}>{entry.notes}</div>
          )}
          {entry.photo && (
            <img src={entry.photo} style={{ width:'100%', maxHeight:200, objectFit:'cover', borderRadius:10, marginBottom:10, marginTop:4 }} alt="catch"/>
          )}
          <div style={{ display:'flex', gap:8, marginTop:4 }}>
            <button onClick={handleShare} disabled={sharing} style={{ padding:'9px 14px', background:'rgba(0,201,167,0.1)', border:'1px solid rgba(0,201,167,0.28)', borderRadius:10, color:'var(--teal)', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Inter,system-ui', display:'flex', alignItems:'center', gap:5, flexShrink:0, opacity:sharing?0.6:1 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              {sharing ? '…' : 'Share'}
            </button>
            {!confirmDel
              ? <button onClick={()=>setConfirmDel(true)} style={{ flex:1, padding:'9px', background:'rgba(255,80,80,0.08)', border:'1px solid rgba(255,80,80,0.25)', borderRadius:10, color:'#FF6B6B', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Inter,system-ui' }}>Delete</button>
