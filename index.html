function AddCatchSheet({ intensity, activeLocation, onSave, onClose }) {
  // Lock background scroll while sheet is open
  React.useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    document.body.style.touchAction = 'none';
    return () => { document.body.style.overflow = prev; document.body.style.touchAction = ''; };
  }, []);
  const [species, setSpecies]   = React.useState('snapper');
  const [length,  setLength]    = React.useState('');
  const [weight,  setWeight]    = React.useState('');
  const now = new Date(); now.setSeconds(0,0);
  const [date, setDate]         = React.useState(now.toISOString().slice(0,16));
  const [location, setLocation] = React.useState(activeLocation ? activeLocation.name : '');
  const [notes, setNotes]       = React.useState('');
  const [photo, setPhoto]       = React.useState(null);
  const fileRef = React.useRef(null);

  const handlePhoto = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 480;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        setPhoto(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleSave = () => {
    onSave({ species, length, weight, date: new Date(date).getTime(), location, notes, photo });
  };

  const selSp = LOG_SPECIES.find(s => s.id === species) || LOG_SPECIES[0];

    <>
      <div onClick={onClose} onTouchMove={e=>e.preventDefault()} onWheel={e=>e.preventDefault()} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.55)', zIndex:200, backdropFilter:'blur(4px)', WebkitBackdropFilter:'blur(4px)', touchAction:'none' }}/>

        border:'1px solid rgba(255,255,255,0.09)', borderBottom:'none',

          <button onClick={onClose} style={{ background:'rgba(255,255,255,0.07)', border:'none', borderRadius:999, width:34, height:34, color:'var(--muted)', cursor:'pointer', fontSize:20, display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>×</button>
        </div>

        {/* Species */}
        <FormField label="Species" style={{ marginBottom:22 }}>
          <div className="tl-hide-scrollbar" style={{ display:'flex', gap:8, overflowX:'scroll', margin:'0 -18px', padding:'4px 18px 6px' }}>
            {LOG_SPECIES.map(s => (
              <button key={s.id} onClick={()=>setSpecies(s.id)} style={{
                flexShrink:0, display:'flex', flexDirection:'column', alignItems:'center', gap:6,
                padding:'10px 12px', borderRadius:14,
                background: species===s.id ? `${s.color}22` : 'rgba(255,255,255,0.03)',
                border:`1px solid ${species===s.id ? s.color : 'rgba(255,255,255,0.08)'}`,
                cursor:'pointer', color:'inherit', fontFamily:'Inter,system-ui',
                boxShadow: species===s.id ? `0 4px 14px ${s.color}44` : 'none',
                transition:'all .18s',
              }}>
                <FishIcon id={s.id} width={38} color={species===s.id ? s.color : 'rgba(255,255,255,0.35)'} active={species===s.id}/>
                <span style={{ fontSize:10, fontWeight:600, color:species===s.id?s.color:'var(--muted)', whiteSpace:'nowrap' }}>{s.name}</span>
              </button>
            ))}
          </div>
        </FormField>

        {/* Photo */}
        <FormField label="Photo" style={{ marginBottom:20 }}>
          <input ref={fileRef} type="file" accept="image/*" capture="camera" onChange={handlePhoto} style={{ display:'none' }}/>

        <FormField label="Notes (optional)" style={{ marginBottom:26 }}>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Caught on soft bait, slack tide, 22m..." rows={3} style={{ ...inputSt, resize:'none', lineHeight:1.55 }}/>

        <button onClick={handleSave} style={{

          fontWeight:700, fontSize:16, cursor:'pointer',
          fontFamily:'Inter,system-ui', letterSpacing:0.2,

    </>

function CatchLog({ tweaks, activeLocation }) {
  const intensity = tweaks.glass;
  const [catches, setCatches] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('tl_catches') || '[]'); } catch { return []; }
  });
  const [showForm, setShowForm] = React.useState(false);
  const [showRegs, setShowRegs] = React.useState(false);
  const [filterSp,  setFilter]  = React.useState('all');
  const [expandId,  setExpand]  = React.useState(null);

  const save = arr => {
    setCatches(arr);
    try { localStorage.setItem('tl_catches', JSON.stringify(arr)); } catch {}
  };

  const addCatch  = entry => { save([{ ...entry, id: Date.now() }, ...catches]); setShowForm(false); };
  const delCatch  = id    => save(catches.filter(c => c.id !== id));

  const totalKg   = catches.reduce((s,c) => s + (parseFloat(c.weight)||0), 0);
  const speciesIn = [...new Set(catches.map(c => c.species))];
  const filtered  = filterSp === 'all' ? catches : catches.filter(c => c.species === filterSp);
  const best      = catches.reduce((b,c) => (parseFloat(c.length)||0) > (parseFloat(b?.length)||0) ? c : b, null);

  return (
    <div style={{ height:'100%', overflowY:'auto', paddingTop:56, paddingBottom:100, color:'var(--ink)' }}>
      <div style={{ padding:'8px 18px 0' }}>

        {/* Header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:1.5, textTransform:'uppercase', color:'var(--teal)' }}>Personal Record</div>
            <h1 style={{ margin:'4px 0 0', fontSize:26, fontWeight:700, letterSpacing:-0.7 }}>
              Catch Log
              {catches.length > 0 && <span style={{ marginLeft:8, fontSize:14, fontWeight:600, color:'var(--muted)', letterSpacing:0 }}>{catches.length}</span>}
            </h1>
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <button onClick={()=>setShowRegs(true)} style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:999, color:'var(--muted)', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Inter,system-ui' }}>Regs</button>
            <button onClick={()=>setShowForm(true)} style={{ display:'flex', alignItems:'center', gap:6, background:'var(--teal)', color:'#0A0F1E', border:'none', borderRadius:999, padding:'10px 16px', fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'Inter,system-ui', boxShadow:'0 4px 16px -4px rgba(0,201,167,0.6)' }}>
              <span style={{ fontSize:19, lineHeight:1, marginTop:-1 }}>+</span> Log
            </button>
          </div>
        </div>

        {/* Stats */}
        {catches.length > 0 && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:20 }}>
            <LogStatTile label="Catches" value={catches.length} unit="fish"/>
            <LogStatTile label="Species" value={speciesIn.length} unit="types" color="var(--teal-2)"/>
            <LogStatTile label="Total wt" value={totalKg < 10 ? totalKg.toFixed(1) : Math.round(totalKg)} unit="kg" color="var(--amber)"/>
          </div>
        )}

        {/* Best fish banner */}
        {best && best.length && (
          <div style={{ marginBottom:16, padding:'10px 14px', borderRadius:12, background:'rgba(0,201,167,0.06)', border:'1px solid rgba(0,201,167,0.18)', display:'flex', alignItems:'center', gap:12 }}>
            <span style={{ fontSize:10, letterSpacing:1, textTransform:'uppercase', color:'var(--muted)' }}>Personal best</span>
            <span style={{ fontWeight:700, color:'var(--teal)', fontSize:14 }}>{best.length} cm</span>
            {best.weight && <span style={{ color:'var(--amber)', fontWeight:600, fontSize:13 }}>{best.weight} kg</span>}
            <span style={{ color:'var(--muted)', fontSize:12 }}>{(LOG_SPECIES.find(s=>s.id===best.species)||{name:best.species}).name}</span>
          </div>
        )}

        {/* Filter chips */}
        {catches.length > 0 && (
          <div className="tl-hide-scrollbar" style={{ overflowX:'scroll', margin:'0 -18px', padding:'0 18px 14px', display:'flex', gap:8 }}>
            <LogFilterChip label="All" active={filterSp==='all'} onClick={()=>setFilter('all')} count={catches.length}/>
            {speciesIn.map(sp => {
              const s = LOG_SPECIES.find(x=>x.id===sp) || { name:sp, color:'#7B8FA1' };
              return <LogFilterChip key={sp} label={s.name} color={s.color} active={filterSp===sp} onClick={()=>setFilter(sp)} count={catches.filter(c=>c.species===sp).length}/>;
            })}
          </div>
        )}

        {/* Cards */}
        {filtered.length === 0
          ? <EmptyCatchLog onAdd={()=>setShowForm(true)}/>
          : <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {filtered.map(c => (
                <CatchCard key={c.id} entry={c} intensity={intensity}
                  expanded={expandId===c.id}
                  onToggle={()=>setExpand(expandId===c.id ? null : c.id)}
                  onDelete={()=>delCatch(c.id)}/>
              ))}
            </div>
        }

      </div>

      {showRegs && <RegsSheet onClose={()=>setShowRegs(false)}/>}
      {showForm && <AddCatchSheet intensity={intensity} activeLocation={activeLocation} onSave={addCatch} onClose={()=>setShowForm(false)}/>}
    </div>
  );
}

function Settings({ tweaks, onLocationSelect, activeLocation, userGeoLoc, setUserGeoLoc, prefs: prefsProp, onPrefsChange, savedLocs = [], toggleSave, isSaved }) {
  const intensity = tweaks.glass;
  const D = window.TL_DATA; // recentLocations only — weather context not needed here

  const [q, setQ]               = React.useState('');
  const [suggestions, setSugg]  = React.useState([]);
  const [searching, setSearching]= React.useState(false);
  const [locating, setLocating] = React.useState(false);
  const [locError, setLocError] = React.useState('');
  const [activeIdx, setActiveIdx]= React.useState(0);
  const prefs = prefsProp || {
    'Units': 'Metric · kt · °C', 'Time format': '24-hour',
    'Tide datum': 'LAT (Lowest Astron.)', 'Notifications': '2 active', 'Watch face': 'Score + tide',
  };
  const searchTimer = React.useRef(null);
  const [nearbySpots, setNearbySpots]   = React.useState([]);
  const [nearbyLoading, setNearbyLoading] = React.useState(false);

  // Fetch real nearby fishing spots from Nominatim when location known
  const fetchNearbySpots = React.useCallback(async (lat, lng) => {
    setNearbyLoading(true);
    setNearbySpots([]);
    const delta = 1.5;
    const vb = `${(lng-delta).toFixed(3)},${(lat+delta).toFixed(3)},${(lng+delta).toFixed(3)},${(lat-delta).toFixed(3)}`;
    const hdr = { headers: { 'Accept-Language': 'en', 'User-Agent': 'TightLinesApp/1.0' } };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const qs = async (term) => fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(term)}&format=json&limit=8&viewbox=${vb}&bounded=1&addressdetails=1`, hdr).then(r => r.json()).catch(() => []);
    try {
      const bays    = await qs('bay');
      await wait(1100);
      const wharves = await qs('wharf');
      await wait(1100);
      const points  = await qs('jetty pier');
      const combined = [...bays, ...wharves, ...points];
      const seen = new Set();
      const unique = combined.filter(p => {
        const key = `${parseFloat(p.lat).toFixed(2)},${parseFloat(p.lon).toFixed(2)}`;
        if (seen.has(key)) return false;
        seen.add(key); return true;
      });
      const h = (slat, slng, n) => { let x = Math.sin(slat*127.1 + slng*311.7 + n*74.3)*43758.5453; return x-Math.floor(x); };
      const spots = unique.map(p => {
        const plat = parseFloat(p.lat), plng = parseFloat(p.lon);
        const dlat = (plat - lat) * 111;
        const dlng = (plng - lng) * 111 * Math.cos(lat * Math.PI / 180);
        const distKm = Math.round(Math.sqrt(dlat*dlat + dlng*dlng));
        const score = Math.round(38 + h(plat, plng, 1) * 57);
        const name = p.name || p.display_name.split(',')[0].trim();
        const region = [p.address?.suburb, p.address?.city, p.address?.county, p.address?.state].filter(Boolean)[0] || '';
        return { name, region, lat: plat, lng: plng, distKm, score };
      }).filter(s => s.distKm <= 150 && s.name.length > 1)
        .sort((a, b) => b.score - a.score)
        .slice(0, 7);
      setNearbySpots(spots);
    } catch(e) { console.warn('Nearby spots error', e); }
    setNearbyLoading(false);
  }, []);

  React.useEffect(() => {
    if (userGeoLoc) fetchNearbySpots(userGeoLoc.lat, userGeoLoc.lng);
  }, [userGeoLoc, fetchNearbySpots]);

  // Debounced Nominatim search
  const handleSearch = val => {
    setQ(val);
    if (searchTimer.current) clearTimeout(searchTimer.current);
    if (val.length < 2) { setSugg([]); return; }
    setSearching(true);
    searchTimer.current = setTimeout(async () => {
      try {
        // Bias results toward user's location; fall back to NZ if unknown
        const _gl = userGeoLoc;
        const viewbox = _gl
          ? `${(_gl.lng-4).toFixed(2)},${(_gl.lat+4).toFixed(2)},${(_gl.lng+4).toFixed(2)},${(_gl.lat-4).toFixed(2)}`
          : '165.0,-34.0,178.5,-47.5';
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(val)}&format=json&limit=8&addressdetails=1&viewbox=${viewbox}&bounded=0`,
          { headers: { 'Accept-Language': 'en' } }
        );
        const data = await res.json();
        setSugg(data.slice(0,5).map(d => ({
          name: d.name || d.display_name.split(',')[0].trim(),
          region: d.display_name.split(',').slice(1,3).join(', ').trim(),
          lat: parseFloat(d.lat), lng: parseFloat(d.lon),
          score: Math.floor(55 + Math.random()*40),
        })));
      } catch(e) { setSugg([]); }
      setSearching(false);
    }, 420);
  };

  // Geolocation
  const detectLocation = () => {
    if (!navigator.geolocation) { setLocError('Geolocation not supported by your browser'); return; }
    setLocating(true); setLocError('');
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        if (setUserGeoLoc) setUserGeoLoc({ lat, lng });
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`, { headers: { 'Accept-Language': 'en' } });
          const d = await res.json();
          const name = d.name || d.address?.suburb || d.address?.city || d.address?.town || 'Current Location';
          const region = [d.address?.state, d.address?.country].filter(Boolean).join(', ');
          selectLoc({ name, region, lat, lng, score: 80 });
        } catch(e) {
          selectLoc({ name: 'Current Location', region: `${Math.abs(lat).toFixed(3)}°${lat<0?'S':'N'}, ${Math.abs(lng).toFixed(3)}°${lng>0?'E':'W'}`, lat, lng, score: 80 });
        }
        setLocating(false);
      },
      err => { setLocError(err.code === 1 ? 'Location access denied — check browser permissions' : 'Could not determine location'); setLocating(false); },
      { timeout: 12000, maximumAge: 120000 }
    );
  };

  const selectLoc = loc => { setQ(''); setSugg([]); setActiveIdx(null); onLocationSelect(loc); };
  const selectRecent = i => { setActiveIdx(i); onLocationSelect(D.recentLocations[i]); };
  const cyclePref = label => {
    const opts = PREF_OPTIONS[label];
    const next = opts[(opts.indexOf(prefs[label]) + 1) % opts.length];
    if (onPrefsChange) onPrefsChange(label, next);
  };

  const isActiveRecent = (loc, i) => activeIdx === i || (activeIdx == null && activeLocation && activeLocation.name === loc.name);
  const showSugg = suggestions.length > 0;

  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 56, paddingBottom: 100, color: 'var(--ink)' }}>
      <div style={{ padding: '8px 18px 0' }}>
        <ScreenTitle eyebrow="Settings" title="Spots & preferences" />

        {/* ── Search with autocomplete ── */}
        <div style={{ position: 'relative', marginBottom: 10 }}>
          <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: showSugg ? '14px 14px 0 0' : 14, padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10 }}>
            {searching
              ? <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ animation: 'tl-pulse 1.2s infinite', flexShrink:0 }}><circle cx="8" cy="8" r="5.5" stroke="var(--teal)" strokeWidth="1.5" strokeDasharray="18 8"/></svg>
              : <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink:0 }}><circle cx="7" cy="7" r="5" stroke="var(--muted)" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="var(--muted)" strokeWidth="1.5" strokeLinecap="round"/></svg>
            }
            <input value={q} onChange={e => handleSearch(e.target.value)}
                   placeholder="Search a fishing spot…"
                   style={{ flex:1, background:'transparent', border:'none', outline:'none', color:'var(--ink)', fontSize:14, fontFamily:'inherit' }}/>
            {q.length > 0 && (
              <button onClick={() => { setQ(''); setSugg([]); }}
                      style={{ background:'none', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:18, padding:'0 2px', lineHeight:1 }}>×</button>
            )}
          </div>
          {showSugg && (
            <div style={{ background:'rgba(10,15,30,0.97)', border:'1px solid rgba(255,255,255,0.08)', borderTop:'none', borderRadius:'0 0 14px 14px', overflow:'hidden' }}>
              {suggestions.map((s, i) => (
                <button key={i} onClick={() => selectLoc(s)} style={{ width:'100%', display:'flex', alignItems:'center', gap:10, padding:'11px 14px', background:'transparent', border:'none', borderTop: i>0?'1px solid rgba(255,255,255,0.05)':'none', cursor:'pointer', color:'inherit', textAlign:'left', fontFamily:'inherit', transition:'background .15s' }}
                        onMouseEnter={e => e.currentTarget.style.background='rgba(0,201,167,0.06)'}
                        onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                  <svg width="12" height="14" viewBox="0 0 12 14" fill="none" style={{ flexShrink:0 }}>
                    <path d="M6 1C3.8 1 2 2.8 2 5c0 3 4 8 4 8s4-5 4-8c0-2.2-1.8-4-4-4z" stroke="var(--teal)" strokeWidth="1.2" fill="rgba(0,201,167,0.18)"/>
                    <circle cx="6" cy="5" r="1.5" fill="var(--teal)"/>
                  </svg>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{s.name}</div>
                    <div style={{ fontSize:10, color:'var(--muted)', marginTop:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{s.region}</div>
                  </div>
                  <span style={{ fontSize:10, fontWeight:700, color:'var(--teal)', fontVariantNumeric:'tabular-nums', flexShrink:0 }}>{s.score}</span>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* ── Detect my location ── */}
        <button onClick={detectLocation} disabled={locating} style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'11px 14px', marginBottom:14, background:'rgba(0,201,167,0.08)', border:'1px solid rgba(0,201,167,0.22)', borderRadius:12, cursor:locating?'default':'pointer', color:locating?'var(--muted)':'var(--teal)', fontSize:13, fontWeight:600, fontFamily:'inherit', transition:'all .2s' }}>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2.8" stroke="currentColor" strokeWidth="1.5"/>
            <circle cx="8" cy="8" r="6.2" stroke="currentColor" strokeWidth="1" strokeOpacity="0.35"/>
            <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          {locating ? 'Detecting…' : 'Use my current location'}
        </button>
        {locError && (
          <div style={{ marginBottom:12, padding:'8px 12px', background:'rgba(255,100,100,0.1)', border:'1px solid rgba(255,100,100,0.25)', borderRadius:10, fontSize:12, color:'#FF9090' }}>{locError}</div>
        )}

        {/* ── Active spot map ── */}
        <TLGlass intensity={intensity} padding={0} style={{ overflow:'hidden', marginBottom:16 }}>
          <DarkMap />
          <div style={{ padding:'12px 14px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div>
              <div style={{ fontSize:12, fontWeight:600 }}>{activeLocation ? activeLocation.name : D.location.name}</div>
              <div style={{ fontSize:10, color:'var(--muted)', fontFamily:'JetBrains Mono, monospace', marginTop:2 }}>
                {activeLocation && activeLocation.lat
                  ? `${Math.abs(activeLocation.lat).toFixed(2)}°${activeLocation.lat<0?'S':'N'} · ${Math.abs(activeLocation.lng).toFixed(2)}°${activeLocation.lng>0?'E':'W'}`
                  : '35.18°S · 174.33°E'}
              </div>
            </div>
            <StatPill tone="teal">Active</StatPill>
          </div>
        </TLGlass>

        {/* ── Saved spots ── */}
        {savedLocs.length > 0 && (
          <div style={{ marginTop: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <SectionHeader title="Saved spots" hint="Tap to navigate" inset />
              <span style={{ fontSize: 10, color: 'var(--amber)', letterSpacing: 0.5 }}>
                {savedLocs.length} saved
              </span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {savedLocs.map((loc, i) => (
                <LocationRow
                  key={i} loc={loc}
                  active={activeLocation && activeLocation.name === loc.name}
                  onSelect={() => selectLoc(loc)}
                  saved={true}
                  onToggleSave={() => toggleSave && toggleSave(loc)} />
              ))}
            </div>
          </div>
        )}

        {/* ── Nearby spots ── */}
        <div style={{ marginTop:28 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            <SectionHeader title="Nearby hot spots" hint="Tap to navigate" inset />
            {nearbyLoading && <span style={{ fontSize:10, color:'var(--teal)', letterSpacing:0.5 }}>Scanning…</span>}
          </div>
          {!userGeoLoc && !nearbyLoading && nearbySpots.length === 0
            ? <button onClick={detectLocation} style={{ width:'100%', padding:'14px', background:'rgba(255,255,255,0.03)', border:'1px dashed rgba(255,255,255,0.12)', borderRadius:12, color:'var(--muted)', fontSize:12, fontFamily:'inherit', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.8" stroke="currentColor" strokeWidth="1.5"/><circle cx="8" cy="8" r="6.2" stroke="currentColor" strokeWidth="1" strokeOpacity="0.35"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
                Detect location to see nearby spots
              </button>
            : nearbyLoading && nearbySpots.length === 0
              ? <div style={{ display:'flex', flexDirection:'column', gap:6 }}>{[0,1,2].map(i => <div key={i} style={{ height:68, borderRadius:12, background:'rgba(255,255,255,0.03)', animation:'tl-stagger .8s ease infinite alternate' }}/>)}</div>
              : nearbySpots.length > 0
                ? <div style={{ display:'flex', flexDirection:'column', gap:6 }}>{nearbySpots.map((spot,i) => <NearbySpotRow key={i} spot={spot} intensity={intensity} onSelect={() => selectLoc(spot)} />)}</div>
                : <div style={{ padding:'12px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:12, fontSize:12, color:'var(--muted)', textAlign:'center' }}>No spots found nearby — try a different area</div>
          }
        </div>

        {/* ── Recent spots ── */}
        <SectionHeader title="Recent spots" hint="Tap to switch" inset />
        <div style={{ marginTop:8, display:'flex', flexDirection:'column', gap:6 }}>
          {D.recentLocations.map((loc, i) => (
            <LocationRow key={i} loc={loc} active={isActiveRecent(loc, i)} onSelect={() => selectRecent(i)} saved={isSaved && isSaved(loc)} onToggleSave={() => toggleSave && toggleSave(loc)} />
          ))}
        </div>

        {/* ── Preferences ── */}
        <div style={{ marginTop:22 }}>
          <SectionHeader title="Preferences" hint="Tap to change" inset />
          <TLGlass intensity={intensity} padding={0} style={{ marginTop:8 }}>
            {Object.entries(prefs).map(([label, value], i, arr) => (
              <PrefRow key={label} label={label} value={value}
                       tone={label==='Notifications'?'teal':undefined}
                       last={i===arr.length-1}
                       onTap={() => cyclePref(label)} />
            ))}
          </TLGlass>
        </div>

        <div style={{ padding:'24px 0 8px', textAlign:'center', fontSize:10, color:'rgba(255,255,255,0.25)', letterSpacing:1.5 }}>
          TIGHT LINES · v2.4 · MADE IN AOTEAROA
        </div>
      </div>
    </div>
  );
}

// ── app

const TWEAK_DEFAULTS = { "glass":"frosted","mode":"night","gauge":"arc","motionLabels":false };

function App() {
  const [screen, setScreen] = React.useState('dashboard');
  const [tweaks, setTweak]  = window.useTweaks(TWEAK_DEFAULTS);
  const [activeLocation, setActiveLocation] = React.useState(window.TL_DATA.location);
  const [locData, setLocData] = React.useState(window.TL_DATA);
  const [dataLoading, setDataLoading] = React.useState(false);
  const [userGeoLoc, setUserGeoLoc] = React.useState(null);
  const [prefs, setPrefs] = React.useState({
    'Units': 'Metric · kt · °C', 'Time format': '24-hour',
    'Tide datum': 'LAT (Lowest Astron.)', 'Notifications': '2 active', 'Watch face': 'Score + tide',
  });
  const handlePrefsChange = (label, value) => setPrefs(p => ({ ...p, [label]: value }));

  // ── Saved / favourite locations ──
  const [savedLocs, setSavedLocs] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('tl_saved') || '[]'); } catch { return []; }
  });
  const toggleSave = loc => {
    setSavedLocs(prev => {
      const exists = prev.some(l => l.name === loc.name);
      const next = exists
        ? prev.filter(l => l.name !== loc.name)
        : [...prev, { name: loc.name, region: loc.region || '', lat: loc.lat, lng: loc.lng }];
      localStorage.setItem('tl_saved', JSON.stringify(next));
      if (!exists && next.length === 1 && Notification && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      return next;
    });
  };
  const isSaved = loc => savedLocs.some(l => l.name === (loc && loc.name));

  const handleLocationSelect = async (loc) => {
    setActiveLocation(loc);
    if (loc.lat != null && loc.lng != null) {
      setUserGeoLoc({ lat: loc.lat, lng: loc.lng });
      // Show algorithmic data immediately, then replace with real data
      setLocData(generateLocationData(loc));
      setDataLoading(true);
      try {
        const real = await fetchWeatherData(loc);
        if (real) setLocData(real);
      } catch(e) {
        console.warn('[TL] Weather fetch error:', e);
      } finally {
        setDataLoading(false);
      }
    } else {
      setLocData(generateLocationData(loc));
    }
  };

  // Auto-detect location on first load
  React.useEffect(() => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
            { headers: { 'Accept-Language': 'en' } }
          );
          const d = await res.json();
          const name = d.name || d.address?.suburb || d.address?.city || d.address?.town || 'Current Location';
          const region = [d.address?.state, d.address?.country].filter(Boolean).join(', ');
          const cc = d.address?.country_code || '';
          handleLocationSelect({ name, region, lat, lng, countryCode: cc });
        } catch(e) {
          handleLocationSelect({ name: 'Current Location', region: '', lat, lng });
        }
      },
      () => { /* silently ignore if denied */ },
      { timeout: 8000, maximumAge: 300000 }
    );
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  React.useEffect(() => {
    const root = document.documentElement;
    if (tweaks.mode === 'predawn') {
      root.style.setProperty('--bg',  '#1A1320');
      root.style.setProperty('--bg-2','#2A1B2C');
      root.style.setProperty('--bg-grad','radial-gradient(ellipse 100% 50% at 50% 0%,#3A2235,#1A1320 70%)');
    } else {
      root.style.setProperty('--bg',  '#0A0F1E');
      root.style.setProperty('--bg-2','#101830');
      root.style.setProperty('--bg-grad','radial-gradient(ellipse 100% 60% at 50% -10%,#102540,#0A0F1E 70%)');
    }
  }, [tweaks.mode]);

  // ── Check saved spots for prime conditions on startup ──
  React.useEffect(() => {
    if (!savedLocs.length) return;
    const lastCheck = parseInt(localStorage.getItem('tl_notif_check') || '0', 10);
    if (Date.now() - lastCheck < 3 * 60 * 60 * 1000) return; // throttle to once per 3h
    localStorage.setItem('tl_notif_check', String(Date.now()));
    const runCheck = async () => {
      if (!Notification || Notification.permission !== 'granted') return;
      for (const loc of savedLocs) {
        try {
          const data = await fetchWeatherData(loc);
          if (!data) continue;
          const hours = (data.hourly || []).slice(0, 24);
          const best = hours.reduce((a, b) => (b.score > a.score ? b : a), { score: 0, label: '' });
          if (best.score >= 80) {
            new Notification('🎣 ' + loc.name, {
              body: 'Prime fishing at ' + (best.label || 'dawn') + ' — score ' + best.score + '/100',
              tag: 'tl-' + loc.name,
              icon: '',
            });
          }
        } catch(e) { /* ignore */ }
      }
    };
    const t = setTimeout(runCheck, 5000);
    return () => clearTimeout(t);
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const screens = {
    dashboard:  <Dashboard tweaks={tweaks} activeLocation={activeLocation} onLocationSelect={handleLocationSelect} setUserGeoLoc={setUserGeoLoc} prefs={prefs} savedLocs={savedLocs} toggleSave={toggleSave} isSaved={isSaved} />,
    conditions: <Conditions tweaks={tweaks} activeLocation={activeLocation} prefs={prefs} />,
    catch:      <Catch tweaks={tweaks} />,
    log:        <CatchLog tweaks={tweaks} activeLocation={activeLocation} />,
    settings:   <Settings tweaks={tweaks} onLocationSelect={handleLocationSelect} activeLocation={activeLocation} userGeoLoc={userGeoLoc} setUserGeoLoc={setUserGeoLoc} prefs={prefs} onPrefsChange={handlePrefsChange} savedLocs={savedLocs} toggleSave={toggleSave} isSaved={isSaved} />,
  };

  return (
    <LocationDataCtx.Provider value={locData}>
      <div style={{ width:'100%', height:'100%', position:'relative', background:'var(--bg-grad),var(--bg)', fontFamily:'Inter,system-ui,sans-serif', color:'var(--ink)', overflow:'hidden' }}>
        {dataLoading && (
          <div style={{
            position:'absolute', top:0, left:0, right:0, height:2, zIndex:999,
            background:'linear-gradient(90deg,transparent,var(--teal),transparent)',
            backgroundSize:'200% 100%', animation:'tl-data-load 1.1s ease-in-out infinite',
          }}/>
        )}
        <div key={screen} style={{ position:'absolute', inset:0, animation:'tl-screen-in .4s cubic-bezier(.21,.61,.35,1)' }}>
          {screens[screen]}
        </div>
        <BottomNav active={screen} onChange={setScreen} />
      </div>
    </LocationDataCtx.Provider>
  );
}

function BottomNav({ active, onChange }) {
  const items = [
    { id:'dashboard',  label:'Today',      icon:NavHomeIcon },
    { id:'conditions', label:'Conditions', icon:NavConditionsIcon },
    { id:'catch',      label:'Forecast',   icon:NavCatchIcon },
    { id:'log',        label:'Log',        icon:NavLogIcon },
    { id:'settings',   label:'Spots',      icon:NavSpotsIcon },
  ];
  return (
    <div style={{ position:'absolute', left:12, right:12, bottom:'max(18px,env(safe-area-inset-bottom,18px))', zIndex:50, borderRadius:24, background:'rgba(10,15,30,0.65)', backdropFilter:'blur(22px) saturate(160%)', WebkitBackdropFilter:'blur(22px) saturate(160%)', border:'1px solid rgba(255,255,255,0.08)', boxShadow:'0 16px 40px -16px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.06)', padding:'8px 8px', display:'flex', gap:2 }}>
      {items.map(it => {
        const on = active === it.id;
        const Icon = it.icon;
        return (
          <button key={it.id} onClick={() => onChange(it.id)} style={{ flex:1, background:'transparent', border:'none', cursor:'pointer', padding:'8px 4px', display:'flex', flexDirection:'column', alignItems:'center', gap:4, color:on?'var(--teal)':'rgba(255,255,255,0.55)', position:'relative', fontFamily:'Inter,system-ui' }}>
            {on && <span style={{ position:'absolute', top:3, left:'50%', transform:'translateX(-50%)', width:24, height:3, borderRadius:2, background:'var(--teal)', boxShadow:'0 0 8px var(--teal)', animation:'tl-pop .35s cubic-bezier(.34,1.56,.64,1)' }}/>}
            <Icon active={on}/>
            <span style={{ fontSize:9.5, letterSpacing:0.5, fontWeight:on?700:500, opacity:on?1:0.75, transform:on?'translateY(0)':'translateY(1px)', transition:'all .25s ease' }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function NavHomeIcon({ active }) {
  return <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H4a1 1 0 0 1-1-1v-8z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" fill={active?'currentColor':'transparent'} fillOpacity={active?0.18:0} style={{ transition:'fill-opacity .25s ease' }}/></svg>;
}
function NavConditionsIcon({ active }) {
  return <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="9" r="3" stroke="currentColor" strokeWidth="1.6" fill={active?'currentColor':'transparent'} fillOpacity={active?0.2:0}/><path d="M3 16c2-2 4-2 6 0s4 2 6 0s2 0 2 0M3 19c2-2 4-2 6 0s4 2 6 0s2 0 2 0" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/></svg>;
}
function NavCatchIcon({ active }) {
  return <svg width="26" height="22" viewBox="0 0 26 22" fill={active?'currentColor':'none'}><path d="M2 11 Q 7 5,18 6 Q 22 7,24 11 Q 22 15,18 16 Q 7 17,2 11 L 0 7 L 3 11 L 0 15 Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" fillOpacity={active?0.18:0}/><circle cx="19" cy="10" r="0.9" fill={active?'var(--bg)':'currentColor'}/></svg>;
}
function NavSpotsIcon({ active }) {
  return <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2C7.7 2 5 4.7 5 8c0 4.5 6 11 6 11s6-6.5 6-11c0-3.3-2.7-6-6-6z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" fill={active?'currentColor':'transparent'} fillOpacity={active?0.18:0}/><circle cx="11" cy="8" r="2.4" stroke="currentColor" strokeWidth="1.6" fill={active?'var(--bg)':'transparent'}/></svg>;
}

function NavLogIcon({ active }) {
  return (
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="4" y="2" width="11" height="15" rx="2" stroke="currentColor" strokeWidth="1.6" fill={active?'currentColor':'transparent'} fillOpacity={active?0.15:0}/>
      <path d="M7 7h5M7 10.5h3.5" stroke={active?'var(--teal)':'currentColor'} strokeWidth="1.4" strokeLinecap="round" strokeOpacity={active?1:0.7}/>
      <circle cx="16" cy="16" r="4" fill={active?'var(--teal)':'var(--bg-2)'} stroke={active?'var(--teal)':'currentColor'} strokeWidth="1.4"/>
      <path d="M14.5 16h3M16 14.5v3" stroke={active?'#0A0F1E':'currentColor'} strokeWidth="1.4" strokeLinecap="round" strokeOpacity={active?1:0.7}/>
    </svg>
  );
}

window.App = App;


// ── mount

function Root() {
  const getVP = () => {
    const vvp = window.visualViewport;
    return { w: vvp ? vvp.width : window.innerWidth, h: vvp ? vvp.height : window.innerHeight };
  };
  const [dims, setDims] = React.useState(getVP);
  React.useEffect(() => {
    const upd = () => setDims(getVP());
    window.addEventListener('resize', upd);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', upd);
    return () => {
      window.removeEventListener('resize', upd);
      if (window.visualViewport) window.visualViewport.removeEventListener('resize', upd);
    };
  }, []);

  // On narrow screens fill the screen; on desktop scale the 402×874 layout
  const isMobile = dims.w <= 540;
  if (isMobile) {
    return (
      <div style={{ width: dims.w, height: dims.h, position: 'relative', overflow: 'hidden', background: '#0A0F1E' }}>
        <App/>
      </div>
    );
  }
  const scale = Math.min(dims.w / 402, dims.h / 874);
  return (
    <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
      <div style={{ width: 402, height: 874, position: 'relative', overflow: 'hidden', background: '#0A0F1E' }}>
        <App/>
      </div>
    </div>
  );
}
const _root = ReactDOM.createRoot(document.getElementById('app-root'));
_root.render(<Root/>);

</script>
</body>
</html>
